<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Дрон — Тельмана / Фабричное</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172433;color:#f5f8fc;font:14px system-ui;touch-action:none;user-select:none}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.pill,#panel{background:#101b29ed;border:1px solid #71849a66;border-radius:14px;padding:9px}#panel{position:fixed;bottom:10px;left:3%;width:94%;display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:8px}button{flex:1;min-height:42px;border:1px solid #71849a;border-radius:12px;background:#27384b;color:white;font-weight:700}button.on{border-color:#ffb629;background:#51401d}#go{background:#ffb629;color:#161b20}#hint{text-align:center;font-size:12px;color:#c9d5e2}#toast{position:fixed;top:20%;left:8%;right:8%;text-align:center;font-size:24px;font-weight:800;text-shadow:0 2px 8px #000}#mapbtn{position:fixed;right:10px;top:48%;width:48px;height:48px;border-radius:50%}</style></head><body><canvas id="map"></canvas><div id="hud"><div class="pill" id="score">🥚 Золотые яйца: 0</div><div class="pill" id="status">Выбери район старта</div></div><button id="mapbtn">⌖</button><div id="toast"></div><div id="panel"><div class="row"><button id="from0" class="on">Старт: Тельмана</button><button id="from1">Старт: Фабричное</button></div><div class="row"><button id="drone" class="on">🛸 Дрон</button><button id="rocket">🚀 Ракета</button></div><button id="go">Начать полёт</button><div id="hint">Веди пальцем для управления. Отпусти — игровой выстрел по объекту под пальцем.</div></div><script>(()=>{const c=document.querySelector("#map"),g=c.getContext("2d"),$=s=>document.querySelector(s);let W,H,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}onresize=resize;resize();const world={w:2400,h:1500};let seed=918273;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function between(a,b){return a+(b-a)*rand()}const ds=[{name:"ТЕЛЬМАНА",x:480,y:730,color:"#304b61",b:[],t:[],a:[]},{name:"ФАБРИЧНОЕ",x:1900,y:730,color:"#3a514e",b:[],t:[],a:[]}];for(const d of ds){for(let r=0;r<7;r++)for(let k=0;k<5;k++){let x=d.x-350+k*140+between(5,30),y=d.y-450+r*130+between(5,30);d.b.push({x,y,w:between(30,60),h:between(20,40)})}for(let i=0;i<5;i++)d.t.push({x:d.x+between(-280,280),y:d.y+between(-390,390),alive:true});for(let i=0;i<2;i++)d.a.push({x:d.x+between(-300,300),y:d.y+between(-400,400),alive:true})}let home=0,kind="drone",mode="ready",craft=null,cam={x:480,y:730},pointer=null,overview=false,score=0,fx=[],smoke=[];function ui(){["from0","from1","drone","rocket"].forEach(id=>$( "#"+id).classList.remove("on"));$("#from"+home).classList.add("on");$("#"+kind).classList.add("on")}$("#from0").onclick=()=>{if(mode==="ready"){home=0;ui()}};$("#from1").onclick=()=>{if(mode==="ready"){home=1;ui()}};$("#drone").onclick=()=>{if(mode==="ready"){kind="drone";ui()}};$("#rocket").onclick=()=>{if(mode==="ready"){kind="rocket";ui()}};$("#go").onclick=()=>{let d=ds[home];craft={x:d.x,y:d.y,a:home?Math.PI:0,t:0};cam={x:d.x,y:d.y};mode="fly";$("#panel").style.display="none";$("#status").textContent="Полёт";$("#toast").textContent=""};$("#mapbtn").onclick=()=>{overview=!overview;cam=overview?{x:1200,y:750}:craft?{x:craft.x,y:craft.y}:{x:ds[home].x,y:ds[home].y}};function scale(){return overview?Math.min(W/world.w,H/world.h):Math.min(W,H)/640}function wp(e){return{x:(e.clientX-W/2)/scale()+cam.x,y:(e.clientY-H/2)/scale()+cam.y}}c.onpointerdown=e=>{if(mode==="fly"){pointer=wp(e);c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(pointer&&mode==="fly")pointer=wp(e)};c.onpointerup=()=>{if(!pointer||!craft)return;let p=pointer;pointer=null;let hit=null;for(const d of ds){for(const o of [...d.t,...d.a])if(o.alive&&Math.hypot(o.x-p.x,o.y-p.y)<(kind==="rocket"?75:45)){hit=o;break}if(hit)break}if(hit){hit.alive=false;score+=20;$("#score").textContent="🥚 Золотые яйца: "+score;$("#toast").textContent="Попадание! Начисляем +20 золотых яиц…";fetch("https://messap.onrender.com/api/minigame/hit",{method:"POST",headers:{Authorization:"Bearer "+(localStorage.getItem("fl_token")||""),"Content-Type":"application/json"},body:"{}"}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Ошибка начисления");$("#toast").textContent="Попадание! +20 золотых яиц · баланс "+Number(d.balance).toLocaleString("ru")}).catch(()=>{$("#toast").textContent="Попадание! +20 в счётчике; войди в аккаунт, чтобы начислить яйца"})for(let i=0;i<40;i++)fx.push({x:hit.x,y:hit.y,vx:between(-150,150),vy:between(-150,150),life:1});for(let i=0;i<18;i++)smoke.push({x:hit.x,y:hit.y,r:8,life:4})}else $("#toast").textContent="Промах — цель не в прицеле"};function district(d){g.fillStyle=d.color;g.fillRect(d.x-390,d.y-500,780,1000);g.strokeStyle="#8294a7";g.lineWidth=14;g.beginPath();for(let i=0;i<8;i++){let x=d.x-330+i*94;g.moveTo(x,d.y-460);g.lineTo(x,d.y+460)}for(let i=0;i<11;i++){let y=d.y-450+i*90;g.moveTo(d.x-360,y);g.lineTo(d.x+360,y)}g.stroke();for(const b of d.b){g.fillStyle="#526a7e";g.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h)}g.fillStyle="white";g.textAlign="center";g.font="bold 30px system-ui";g.fillText(d.name,d.x,d.y-525);for(const t of d.t)if(t.alive){g.fillStyle="#e14b4b";g.fillRect(t.x-15,t.y-12,30,24);g.fillStyle="white";g.font="10px system-ui";g.fillText("СКЛАД",t.x,t.y+27)}for(const a of d.a)if(a.alive){g.fillStyle="#ff9b42";g.fillRect(a.x-15,a.y-12,30,24);g.fillStyle="white";g.font="10px system-ui";g.fillText("ТЕРМИНАЛ",a.x,a.y+27)}}function draw(){g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);g.fillStyle="#192839";g.fillRect(0,0,W,H);g.save();g.translate(W/2,H/2);g.scale(scale(),scale());g.translate(-cam.x,-cam.y);g.strokeStyle="#293b4d";for(let x=0;x<world.w;x+=100){g.beginPath();g.moveTo(x,0);g.lineTo(x,world.h);g.stroke()}g.fillStyle="#3a4a59";g.fillRect(0,728,world.w,44);ds.forEach(district);fx=fx.filter(p=>{p.life-=.025;p.x+=p.vx*.025;p.y+=p.vy*.025;g.globalAlpha=p.life;g.fillStyle="#ffb629";g.beginPath();g.arc(p.x,p.y,4,0,7);g.fill();return p.life>0});smoke=smoke.filter(p=>{p.life-=.02;p.r+=.3;g.globalAlpha=Math.min(.5,p.life/4);g.fillStyle="#737d87";g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();return p.life>0});g.globalAlpha=1;if(craft&&mode==="fly"){craft.t++;if(pointer){let a=Math.atan2(pointer.y-craft.y,pointer.x-craft.x),dif=Math.atan2(Math.sin(a-craft.a),Math.cos(a-craft.a));craft.a+=Math.max(-.08,Math.min(.08,dif))}let v=kind==="rocket"?7.5:3.6;craft.x+=Math.cos(craft.a)*v;craft.y+=Math.sin(craft.a)*v;cam.x+=(craft.x-cam.x)*.12;cam.y+=(craft.y-cam.y)*.12;if(craft.t>(kind==="rocket"?440:1200)||craft.x<0||craft.x>world.w||craft.y<0||craft.y>world.h){mode="ready";craft=null;$("#panel").style.display="flex";$("#status").textContent="Полёт завершён";$("#toast").textContent="Полёт завершён"}}if(craft){g.save();g.translate(craft.x,craft.y);g.rotate(craft.a);g.fillStyle="#f5f8fc";g.beginPath();g.moveTo(20,0);g.lineTo(-14,-8);g.lineTo(-20,0);g.lineTo(-14,8);g.fill();g.restore()}g.restore()}function loop(){draw();requestAnimationFrame(loop)}ui();loop()})();</script></body></html>
