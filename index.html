<head>

<title>ФабрLink</title>

<link rel="apple-touch-icon" href="2341F654-35F3-4085-8DDD-522F7929D582.png">
<style>
:root{color-scheme:dark;--bg:#060b1f;--tx:#eaf0ff;--mut:#8b9bc4;--line:#8aa4ff1f;--blue:#2f8cff;--gold:#ffd66b;--pn:linear-gradient(165deg,#121c4acc,#0a1130ee);--in:#ffffff0f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-user-select:none;user-select:none;background:radial-gradient(900px 620px at 8% 0,#1c3fae 0,transparent 60%),radial-gradient(800px 620px at 100% 100%,#40209f 0,transparent 55%),var(--bg)}
html{position:fixed;inset:0;width:100%}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea{font-size:16px;cursor:text;-webkit-user-select:text;user-select:text;outline:0}
button:focus-visible{outline:2px solid var(--blue)}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;width:100%;height:var(--vh,100dvh);min-height:0;padding:14px;overflow:hidden}
.shell{height:100%;max-width:1380px;margin:auto;position:relative;display:grid;grid-template-columns:78px 330px minmax(0,1fr);border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#070d2680}
.nav{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-right:1px solid var(--line);background:#0a113066}
.lg{width:44px;height:44px;display:grid;place-items:center;color:#cfe0ff;margin-bottom:8px}
.nav button{width:100%;padding:9px 2px;border-radius:14px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:#fff;background:linear-gradient(135deg,#2f8cff,#4a5dff);box-shadow:0 6px 18px #2f6bff55}
.nav .sp{flex:1}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--pn)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 16px 10px}
.sh h1{font-size:22px;font-weight:700}
.sh h1 span{color:var(--blue)}
.sh button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--tx);background:var(--in)}
.sr{position:relative;margin:0 14px 8px}
.sr .ic{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--mut)}
.sr input{width:100%;padding:11px 14px 11px 38px;border-radius:14px;background:var(--in);border:1px solid var(--line)}
.sr input:focus{border-color:var(--blue)}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 8px 8px}
.lbl{display:flex;align-items:center;gap:6px;padding:10px 10px 4px;color:var(--mut);font-size:12px}
.lbl .ic{width:14px;height:14px}
.it{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:14px;text-align:left}
.it:active{background:var(--in)}
.it.on{background:linear-gradient(90deg,#2f6bff55,#2f6bff18)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background-size:cover;background-position:center}
.av .ic{width:24px;height:24px}
.av.big{width:96px;height:96px;font-size:30px;margin:6px auto 0}
.av.big .ic{width:44px;height:44px}
.mt{min-width:0;flex:1}
.mt b,.mt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt small{color:var(--mut);margin-top:2px}
.tm{font-size:11px;color:var(--mut);align-self:flex-start;margin-top:4px}
.vf{display:inline-block;vertical-align:-2px;margin-left:5px}
.vf .ic{width:15px;height:15px}
.main{display:flex;flex-direction:column;min-height:0;min-width:0;background:linear-gradient(180deg,#0b1338aa,#070c2488)}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#0a113088}
.ch .av{width:42px;height:42px;font-size:14px}
.ch .t{flex:1;min-width:0}
.ch b{display:block}
.ch small{color:var(--mut)}
.ib2{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--tx)}
.ib2:active{background:var(--in)}
.back{display:none}
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 8px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;margin:10px 0;padding:3px 14px;border-radius:99px;background:#ffffff12;color:var(--mut);font-size:12px}
.bub{max-width:min(78%,520px);padding:8px 12px 6px;border-radius:16px 16px 16px 5px;background:#26387a88;border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#2a74f5,#1d52d0);border-color:transparent;border-radius:16px 16px 5px 16px}
.bub.pend{opacity:.65}
.bub .nm{display:block;font-size:12px;font-weight:700}
.bub time{float:right;margin:7px 0 0 10px;font-size:11px;color:#ffffff90;display:inline-flex;align-items:center;gap:3px}
.bub time .ic{width:12px;height:12px}
.bub.im{padding:4px;white-space:normal}
.bub.im time{position:absolute;right:10px;bottom:9px;margin:0;padding:1px 7px;border-radius:99px;background:#0008;float:none}
.bub.im{position:relative}
.bub.im .nm{padding:3px 8px}
.ph{display:block;width:min(280px,66vw);aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#ffffff10;cursor:zoom-in}
.ph.bad{cursor:default;outline:1px dashed var(--line)}
.cm{display:flex;gap:8px;align-items:flex-end;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0a113088}
.cm textarea{flex:1;resize:none;max-height:120px;padding:11px 16px;border-radius:22px;background:var(--in);border:1px solid var(--line);line-height:1.35}
.cm .ib2{width:44px;height:44px;border-radius:50%;background:var(--in);color:var(--mut)}
.cm .snd{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2f8cff,#4a5dff);display:grid;place-items:center;flex:none;color:#fff}
.em{margin:auto;padding:24px;text-align:center;color:var(--mut)}
.info{display:none;position:absolute;top:0;right:0;bottom:0;width:min(320px,100%);z-index:5;flex-direction:column;background:linear-gradient(165deg,#111b45f2,#0a1130fa);border-left:1px solid var(--line)}
.shell.info-on.in-chat .info{display:flex}
.ih{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.ibody{flex:1;overflow-y:auto;padding:0 16px 20px;text-align:center}
.ibody h3{margin-top:12px;font-size:18px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.st div{padding:12px;border-radius:14px;background:var(--in);border:1px solid var(--line)}
.st b{display:block;font-size:22px}
.st span{color:var(--mut);font-size:12px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#ffffff10;cursor:zoom-in}
.pg{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 24px}
.wal{display:flex;align-items:center;gap:12px;margin:14px 0;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#5a4210cc,#a87a1acc);color:#ffe9a8;font-weight:800;font-size:18px;text-align:left}
.wal .ic{width:30px;height:30px}
.wal small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:14px;background:var(--in);margin-bottom:12px}
.seg button{padding:9px;border-radius:11px;color:var(--mut)}
.seg button.on{background:linear-gradient(135deg,#2f8cff,#4a5dff);color:#fff}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gc{border-radius:18px;padding:14px 10px 12px;background:var(--pn);border:1px solid var(--tc,var(--line));display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gc b{font-size:14px}
.gc small{color:var(--mut)}
.gi{width:78px;height:78px;padding:12px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffffff22,#0a1130 72%);border:1px solid var(--tc,var(--line))}
.gi.sm{display:inline-block;width:50px;height:50px;padding:8px;margin:3px}
.gsv{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 6px #0007)}
.gsv .a{fill:var(--a)}.gsv .b{fill:var(--b)}.gsv .d{fill:var(--b);opacity:.8}.gsv .k{fill:#0c1230}.gsv .w{fill:#fff;fill-opacity:.55}
.gsv .s{fill:none;stroke:var(--a);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pr{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-weight:800}
.pr .ic{width:16px;height:16px}
.lv{font-size:11px;padding:1px 9px;border-radius:99px;background:#ffffff18}
.bt{width:100%;padding:10px;border-radius:12px;background:var(--in);border:1px solid var(--line);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.bt .ic{width:16px;height:16px}
.bt.go{background:linear-gradient(135deg,#c28a1c,#f6d56d);border-color:transparent;color:#2e1c00;font-weight:700}
.bt.bl{background:linear-gradient(135deg,#2f8cff,#4a5dff);border-color:transparent;color:#fff;font-weight:700}
.bt:disabled{opacity:.45}
.mut{color:var(--mut);font-size:13px}
.au{height:100%;display:grid;place-items:center;padding:16px}
.ac{width:min(100%,380px);padding:26px;border-radius:24px;background:var(--pn);border:1px solid var(--line);display:grid;gap:12px}
.ac input{width:100%;padding:13px 14px;border-radius:14px;background:var(--in);border:1px solid var(--line)}
.ac .seg{margin:0}
.br{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800}
.br img{width:46px;height:46px;border-radius:13px;object-fit:cover}
.er{color:#ff8296;min-height:18px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:10px 16px;border-radius:14px;background:#000d;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;z-index:40;background:#000d;display:grid;place-items:center;padding:16px;touch-action:none}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
#lb button{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;color:#fff}
@media(min-width:1200px){.shell.info-on.in-chat{grid-template-columns:78px 330px minmax(0,1fr) 300px}.shell.info-on.in-chat .info{position:static;width:auto}}
@media(max-width:760px){
#app{padding:0}
.shell{height:100%;min-height:0;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;max-width:none;border:0;border-radius:0}
.nav{grid-row:2;grid-column:1;min-height:76px;flex-direction:row;justify-content:space-around;gap:0;padding:4px 6px max(8px,env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:#0a1130f2}
.nav button{flex:1;padding:7px 2px}
.nav button.on{box-shadow:none}
.lg,.nav .sp,.nav .lo{display:none}
.side,.main{grid-row:1;grid-column:1}
.shell:not(.t-chats) .side,.shell.in-chat .side{display:none}
.shell.t-chats:not(.in-chat) .main{display:none}
.shell.in-chat{grid-template-rows:minmax(0,1fr)}
.shell.in-chat .nav{display:none}
.back{display:grid}
.side{border-right:0}
.info{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.fm-box{padding:16px;border:1px solid #ffd66b44;border-radius:18px;background:linear-gradient(145deg,#382b10aa,#101735)}.slot-reels{display:flex;justify-content:center;gap:10px;margin:18px 0}.slot-reels span{width:72px;height:82px;display:grid;place-items:center;font-size:38px;border-radius:14px;background:#070b1d;border:1px solid #ffd66b66;box-shadow:inset 0 0 18px #ffd66b18}.fm-row{display:flex;gap:8px;margin:10px 0}.fm-row input{min-width:0;width:100%;padding:11px 12px;border-radius:12px;background:#ffffff12;border:1px solid var(--line)}.fm-result{text-align:center;min-height:24px;margin:10px 0;color:#ffe18a;font-weight:800}.admin-stars{margin-top:16px;padding:14px;border-radius:16px;background:#ffffff08;border:1px solid var(--line)}
<style>.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d875;margin-left:6px}.online-dot.off{background:#778092}.msg-tools{display:none;gap:5px;margin-top:7px;flex-wrap:wrap}.bub.msg-menu-open .msg-tools{display:flex}.msg-tools button{font-size:12px;padding:6px 9px;border-radius:8px;background:#0002;color:inherit;touch-action:manipulation}.bub{user-select:none;-webkit-user-select:none}.reply-preview{font-size:12px;padding:4px 7px;border-left:3px solid #ffd66b;background:#0002;margin-bottom:5px}
/* Mini-game */
.mg-screen{flex:1;min-height:0;overflow:auto;padding:16px;background:radial-gradient(ellipse at 50% 0,#172b60,#080e27 72%)}
.mg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mg-head h2{font-size:22px}.mg-sub{color:var(--mut);font-size:13px}
.mg-teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.mg-team{padding:13px 10px;border-radius:14px;border:1px solid #ffffff20;background:#ffffff08;text-align:center}
.mg-team.on{border-color:#57a1ff;background:#2f8cff25;box-shadow:0 0 0 1px #2f8cff33}
.mg-team b{display:block;font-size:15px}.mg-team small{color:var(--mut)}
.mg-map{position:relative;min-height:260px;aspect-ratio:1.45;border-radius:18px;overflow:hidden;border:1px solid #7f9bce55;background-color:#142642;background-image:linear-gradient(#9db9e01a 1px,transparent 1px),linear-gradient(90deg,#9db9e01a 1px,transparent 1px),linear-gradient(135deg,#1d3c3b,#182b42 50%,#3a3030);background-size:24px 24px,24px 24px,100% 100%}
.mg-road{position:absolute;left:-5%;top:56%;width:110%;height:22px;background:#747f8d;transform:rotate(-9deg);border-block:2px solid #d6dce2aa}
.mg-rail{position:absolute;left:-4%;top:69%;width:108%;height:5px;background:repeating-linear-gradient(90deg,#d6d6d6 0 10px,#333 10px 15px);transform:rotate(-9deg)}
.mg-building{position:absolute;width:24%;height:19%;display:grid;place-items:center;border:2px solid #d8e4f5aa;border-radius:5px;background:linear-gradient(135deg,#6c7f93,#354a5d);box-shadow:inset 0 0 0 4px #14233b;color:white;font-size:clamp(10px,2vw,13px);text-align:center}
.mg-building:after{content:"";position:absolute;inset:5px;border:1px solid #ffffff30}
.mg-b1{left:8%;top:13%}.mg-b2{right:8%;top:17%}.mg-b3{left:12%;bottom:10%}.mg-b4{right:12%;bottom:9%}
.mg-base{position:absolute;top:5px;font-size:10px;font-weight:800;letter-spacing:.4px;padding:4px 7px;border-radius:6px;background:#0a102acc}
.mg-base.left{left:5px;color:#79b5ff}.mg-base.right{right:5px;color:#ff9c9c}
.mg-train{position:absolute;left:42%;top:63%;display:flex;gap:3px;transform:rotate(-9deg);transition:left .4s}
.mg-train span{width:23px;height:13px;border-radius:3px;background:#d5a75e;border:1px solid #ffe0a0}
.mg-drone{position:absolute;left:47%;top:35%;font-size:26px;filter:drop-shadow(0 3px 4px #0008)}
.mg-map-hit{position:absolute;inset:0;display:grid;place-items:center;background:#060b1f99;color:white;font-weight:800;font-size:20px;text-shadow:0 2px 6px #000}
.mg-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mg-controls label{display:block;color:var(--mut);font-size:12px;margin-bottom:5px}
.mg-controls select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#101a3b}
.mg-fire{grid-column:1/-1;padding:13px;border-radius:13px;background:linear-gradient(135deg,#2f8cff,#4a5dff);font-weight:800;color:white}
.mg-score{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding:12px;border-radius:12px;background:#ffffff0b;font-size:13px}
.mg-score b{font-size:18px}
@media(max-width:760px){.mg-screen{padding:14px}.mg-map{min-height:230px}.mg-head h2{font-size:19px}}

</style>
</head>

async function api(p,o={}){
  const h={'Content-Type':'application/json'};if(S.token)h.Authorization='Bearer '+S.token;
  const c=new AbortController(),to=setTimeout(()=>c.abort(),40000);
  try{
    const r=await fetch(API+p,{...o,headers:h,signal:c.signal});let d={};try{d=await r.json()}catch{}
    if(r.status===401&&S.token){logout(true);throw new Error(d.error||'Нужно войти снова')}
    if(!r.ok)throw new Error(d.error||'Ошибка сервера ('+r.status+')');return d
  }catch(e){throw e.name==='AbortError'?new Error('Сервер не отвечает, попробуйте ещё раз'):e instanceof TypeError?new Error('Нет соединения с сервером'):e}
  finally{clearTimeout(to)}
}

/* ===== аватары ===== */
function blobUrl(d){try{const[h,b]=d.split(','),m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:m}))}catch{return''}}
function setAv(u,d){if(!d){delete S.av[u];delete S.raw[u];return}if(S.raw[u]===d)return;if(S.av[u])URL.revokeObjectURL(S.av[u]);S.raw[u]=d;S.av[u]=blobUrl(d)}
const hue=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return h};
function av(n,cls=''){const d=n===GROUP&&S.settings.bot_avatar?blobUrl(S.settings.bot_avatar):S.av[n],u=S.av[n];const src=n===GROUP&&S.settings.bot_avatar?d:u;return'<div class="av '+cls+'" style="'+(src?"background-image:url('"+src+"')":n===GROUP?'background:linear-gradient(135deg,#2f8cff,#7a4dff)':'background:linear-gradient(135deg,hsl('+hue(n)+' 65% 52%),hsl('+(hue(n)+40)+' 65% 38%))')+'">'+(src?'':n===GROUP?ic('globe'):esc(String(n||'?').slice(0,2).toUpperCase()))+'</div>'}

/* ===== фото в чате ===== */
const pend={};
function getImg(id){if(S.imgs[id])return Promise.resolve(S.imgs[id]);return pend[id]||(pend[id]=fetch(API+'/api/images/'+id,{headers:{Authorization:'Bearer '+S.token}}).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>S.imgs[id]=URL.createObjectURL(b)).finally(()=>delete pend[id]))}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);getImg(e.target.dataset.img).then(u=>{e.target.src=u;e.target.classList.add('ok')}).catch(()=>e.target.classList.add('bad'))}}),{rootMargin:'300px'});
function lazyImgs(root){root.querySelectorAll('img[data-img]:not(.ok)').forEach(el=>{const u=S.imgs[el.dataset.img];if(u){el.src=u;el.classList.add('ok')}else io.observe(el)})}
function prep(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);let d=c.toDataURL('image/jpeg',.82);if(d.length>1400000)d=c.toDataURL('image/jpeg',.55);res({data:d,w,h})};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Не удалось открыть изображение'))};im.src=u})}
async function sendImage(file){
  if(!file||!S.cur||!file.type.startsWith('image/'))return;
  const peer=S.cur;let p;try{p=await prep(file)}catch(e){return toast(e.message)}
  const tmp={id:'t'+Date.now()+Math.random(),f:S.me,x:'[img:local]',t:Date.now(),p:1,local:p.data,w:p.w,h:p.h};
  (S.cache[peer]=S.cache[peer]||[]).push(tmp);if(S.cur===peer)drawMsgs(true);paintSide();
  try{
    const d=await api('/api/images',{method:'POST',body:JSON.stringify({peer,image:p.data,w:p.w,h:p.h})});
    const m=IMG.exec(d.message.x);if(m)S.imgs[m[1]]=blobUrl(p.data);
    const a=S.cache[peer],i=a.indexOf(tmp);if(i>-1){a.some(x=>String(x.id)===String(d.message.id))?a.splice(i,1):a[i]=d.message}
  }catch(e){const a=S.cache[peer],i=a.indexOf(tmp);if(i>-1)a.splice(i,1);toast(e.message)}
  if(S.cur===peer)drawMsgs(false);S.reply=null;$('#replybar')?.remove();paintSide();paintInfo()
}
function openLb(src){const l=$('#lb');l.innerHTML='<img src="'+src+'" alt=""><button aria-label="Закрыть">'+ic('close')+'</button>';l.hidden=false}
function closeLb(){$('#lb').hidden=true}
$('#lb').onclick=closeLb;

/* ===== данные ===== */
async function loadMe(){const d=await api('/api/me');S.me=d.username;S.prof=d;setAv(S.me,d.avatar_data);localStorage.setItem('fl_session',S.me)}
async function loadUsers(){const d=await api('/api/users');S.presence={};d.users.forEach(u=>{setAv(u.username,u.avatar_data);S.presence[u.username]=!!u.last_seen_at&&(Date.now()-new Date(u.last_seen_at).getTime()<90000)});S.users=d.users.map(u=>u.username)}
async function thread(n){const d=await api('/api/messages?peer='+encodeURIComponent(n));return S.cache[n]=(d.messages||[]).concat((S.cache[n]||[]).filter(m=>m.p))}
async function loadGifts(){S.gifts=await api('/api/gifts');setAv(S.me,S.gifts.avatar);return S.gifts}
async function loadSettings(){try{S.settings=await api('/api/settings');applyGlobalSettings()}catch(e){}}
function applyGlobalSettings(){const bg=S.settings.chat_background;if(bg){const css='linear-gradient(#07102dcc,#07102dcc),url("'+bg.replace(/"/g,'%22')+'")';document.body.style.backgroundImage=css;document.body.style.backgroundSize='cover';document.body.style.backgroundPosition='center';document.querySelectorAll('.main,.msgs').forEach(el=>{el.style.backgroundImage=css;el.style.backgroundSize='cover';el.style.backgroundPosition='center'})}}

/* ===== вход ===== */
function auth(msg){
  S.cur=null;
  $('#app').innerHTML='<section class="au"><form class="ac" id="af"><div class="br"><img src="2341F654-35F3-4085-8DDD-522F7929D582.png" alt="">ФабрLink</div><div class="seg"><button type="button" data-m="login" class="'+(S.mode==='login'?'on':'')+'">Вход</button><button type="button" data-m="reg" class="'+(S.mode==='reg'?'on':'')+'">Регистрация</button></div><input id="nick" autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="Ник (латиница, цифры, _)"><input id="pass" type="password" autocomplete="'+(S.mode==='login'?'current-password':'new-password')+'" placeholder="Пароль">'+(S.mode==='reg'?'<input id="pass2" type="password" autocomplete="new-password" placeholder="Повторите пароль">':'')+'<div class="er" id="er">'+esc(msg||'')+'</div><button class="bt bl" id="go" style="padding:13px;font-size:15px">'+(S.mode==='login'?'Войти':'Создать аккаунт')+'</button></form></section>';
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;auth()});
  $('#af').onsubmit=async e=>{
    e.preventDefault();
    const n=$('#nick').value.trim().toLowerCase(),p=$('#pass').value,er=$('#er');
    if(!/^[a-z0-9_]{3,20}$/.test(n))return er.textContent='Ник: 3–20 символов, латиница, цифры и _';
    if(p.length<6)return er.textContent='Пароль не короче 6 символов';
    if(S.mode==='reg'&&p!==$('#pass2').value)return er.textContent='Пароли не совпадают';
    const b=$('#go'),t0=b.textContent;b.disabled=true;er.textContent='';
    const w=setTimeout(()=>b.textContent='Сервер просыпается…',3500);
    try{
      const d=await api(S.mode==='reg'?'/api/register':'/api/login',{method:'POST',body:JSON.stringify({username:n,password:p})});
      S.token=d.token;S.me=d.username;localStorage.setItem('fl_token',S.token);localStorage.setItem('fl_session',S.me);S.cache={};S.gifts=null;boot()
    }catch(x){er.textContent=x.message;b.disabled=false;b.textContent=t0}
    finally{clearTimeout(w)}
  }
}
function logout(silent){S.token='';S.me='';S.cur=null;S.cache={};S.gifts=null;localStorage.removeItem('fl_token');localStorage.removeItem('fl_session');auth(silent===true?'Сессия истекла, войдите снова':'')}

const NAV=[['chats','chat','Чаты'],['group','users','Группа'],['minigame','gamepad-2','Мини-игра'],['gifts','gift','Подарки'],['saved','bookmark','Избранное'],['profile','user','Профиль']];
const navAct=()=>S.tab!=='chats'?S.tab:S.cur===GROUP?'group':S.cur===S.me?'saved':'chats';
function mount(){
  $('#app').innerHTML='<div class="shell t-chats" id="sh"><nav class="nav"><div class="lg">'+ic('logo')+'</div>'+NAV.map(n=>'<button data-t="'+n[0]+'">'+ic(n[1])+n[2]+'</button>').join('')+'<span class="sp"></span><button class="lo" id="lo">'+ic('logout')+'Выйти</button></nav><section class="side"><div class="sh"><h1>Сообщения <span id="cnt"></span></h1><button id="cp" aria-label="Поиск">'+ic('edit')+'</button></div><div class="sr">'+ic('search')+'<input id="q" placeholder="Поиск по нику" autocomplete="off"></div><div class="list" id="list"></div></section><section class="main" id="main"></section><aside class="info" id="info"></aside></div>';

     if(t==='minigame'){S.profileTarget=null;S.tab='minigame';S.cur=null;setShell();paint();return}
    if(t==='saved')return openChat(S.me);
    S.tab=t;if(t!=='profile')S.profileTarget=null;if(t==='chats'&&(innerWidth<=760||[GROUP,S.me].includes(S.cur)))S.cur=null;

function setShell(){
  const inChat=S.tab==='chats'&&!!S.cur;
  $('#sh').className='shell t-'+S.tab+(inChat?' in-chat':'')+(S.info?' info-on':'');
  const a=navAct();document.querySelectorAll('.nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===a));
  paintInfo()
}
async function boot(){
  if(!S.token||!S.me)return auth();
  mount();
  try{await Promise.all([loadMe(),loadUsers(),loadSettings()])}catch(e){if(!S.token)return;toast(e.message)}
  if($('#sh')){paintSide();paint();api('/api/presence/ping',{method:'POST',body:'{}'}).catch(()=>{});setInterval(async()=>{try{await api('/api/presence/ping',{method:'POST',body:'{}'});await loadUsers();if(S.tab==='chats'){paintSide();if(S.cur)paintChat()}}catch{}},30000)}
}
function openChat(n){S.tab='chats';S.profileTarget=null;S.cur=n;setShell();paintSide();paintChat()}
function paint(){if(S.tab==='gifts')paintGifts();else if(S.tab==='profile')paintProfile();else if(S.tab==='minigame')paintMiniGame();else paintChat()}

async function paintChat(){
  const m=$('#main');
  if(!S.cur){m.innerHTML='<div class="em">Выберите чат, чтобы начать общение</div>';return}

  $('#bk').onclick=()=>{S.cur=null;setShell();paintSide();paintChat()};

  $('#ms').addEventListener('pointerdown',e=>{

  });

  document.addEventListener('click',e=>{

function drawMsgs(force){const box=$('#ms');if(!box||!S.cur)return;const items=S.cache[S.cur];if(!items){box.innerHTML='<div class="em">Загрузка…</div>';return}const near=box.scrollHeight-box.scrollTop-box.clientHeight<120,g=S.cur===GROUP;let h='',d='';for(const m of items){const k=dk(m.t);if(k!==d){d=k;h+='<div class="day">'+k+'</div>'}const me=m.f===S.me,x=IMG.exec(m.x),nm=g&&!me?'<span class="nm">'+esc(disp(m.f))+'</span>':'',rp=m.reply_x?'<div class="reply-preview">↪ '+esc(m.reply_f||'')+': '+esc(m.reply_x)+'</div>':m.forwarded_from?'<div class="reply-preview">Переслано от @'+esc(m.forwarded_from)+'</div>':'',tools='<div class="msg-tools"><button data-msgact="reply" data-id="'+esc(m.id)+'">Ответить</button><button data-msgact="forward" data-id="'+esc(m.id)+'">Переслать</button><button data-msgact="copy" data-id="'+esc(m.id)+'">Копировать</button></div>';if(x)h+='<div class="bub'+(me?' me':'')+'">'+nm+rp+'<img class="ph" data-img="'+x[1]+'" alt=""><time>'+hm(m.t)+'</time>'+tools+'</div>';else h+='<div class="bub'+(me?' me':'')+(m.p?' pend':'')+'">'+nm+rp+esc(m.x)+'<time>'+hm(m.t)+(m.p?ic('clock'):'')+'</time>'+tools+'</div>'}box.innerHTML=h||'<div class="em">Напишите первое сообщение</div>';lazyImgs(box);if(force||near)box.scrollTop=box.scrollHeight}
function autosize(){const t=$('#msg');if(!t)return;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}
async function send(){
  const ta=$('#msg');if(!ta||!S.cur)return;
  const body=ta.value.trim();if(!body)return;const replyTo=S.reply;
  const peer=S.cur,tmp={id:'t'+Date.now(),f:S.me,x:body,t:Date.now(),p:1};
  ta.value='';autosize();(S.cache[peer]=S.cache[peer]||[]).push(tmp);drawMsgs(true);paintSide();
  try{
    const d=await api('/api/messages',{method:'POST',body:JSON.stringify({peer,body,replyTo:replyTo?.id})});
    const a=S.cache[peer],i=a.indexOf(tmp);
    if(i>-1){a.some(m=>String(m.id)===String(d.message.id))?a.splice(i,1):a[i]=d.message}
  }catch(e){
    const a=S.cache[peer],i=a.indexOf(tmp);if(i>-1)a.splice(i,1);
    toast(e.message);const t2=$('#msg');if(S.cur===peer&&t2&&!t2.value){t2.value=body;autosize()}
  }
  if(S.cur===peer)drawMsgs(false);paintSide()
}

  const n=S.cur,g=n===GROUP,t=g?GT:n===S.me?'Избранное':n,items=S.cache[n]||[],ph=items.filter(m=>IMG.test(m.x));

  if(S.gt==='shop')h+=cat.map(g=>{const p=shopPal(g.price);return'<div class="gc" style="--tc:'+p[0]+'66"><div class="gi">'+gsv(g.id,p)+'</div><b>'+esc(g.name)+'</b><span class="pr">'+ic('egg')+fmt(g.price)+'</span><button class="bt go" data-buy="'+g.id+'"'+(d.balance<g.price?' disabled':'')+'>Купить</button></div>'}).join('');
  else h+=inv.length?inv.map(i=>{const g=cat.find(x=>x.id===i.gift_id)||{id:1,name:'Подарок'},on=eq.includes(Number(i.id)),p=PAL[i.color]||PAL['Золото'],cost=750*Number(i.level);return'<div class="gc" style="--tc:'+p[0]+'88"><div class="gi">'+gsv(g.id,p)+'</div><b>'+esc(g.name)+'</b><span class="lv">ур. '+i.level+'</span><small>'+esc(i.color)+' · '+esc(i.pattern)+'</small><button class="bt go" data-up="'+i.id+'"'+(d.balance<cost?' disabled':'')+'>'+ic('spark')+'Улучшить · '+fmt(cost)+'</button><button class="bt" data-eq="'+i.id+'">'+ic('star')+(on?'Убрать с профиля':'На профиль')+'</button></div>'}).join(''):'<div class="em" style="grid-column:1/-1">Пока пусто. Загляни в магазин.</div>';

  $('.pg').scrollTop=sc
}
async function onMain(e){
  const b=e.target.closest('button');if(!b||b.disabled)return;const D=b.dataset;
  if(D.sendgift){b.disabled=true;try{await api('/api/gifts/send-own',{method:'POST',body:JSON.stringify({target:S.profileTarget,inventoryId:Number(D.sendgift)})});S.gifts.inventory=S.gifts.inventory.filter(x=>String(x.id)!==String(D.sendgift));S.gifts.equipped=S.gifts.equipped.filter(x=>String(x)!==String(D.sendgift));toast('Подарок отправлен');paintProfile()}catch(x){toast(x.message);b.disabled=false}return}
  if(D.buyfor){b.disabled=true;try{const r=await api('/api/gifts/buy-for',{method:'POST',body:JSON.stringify({target:S.profileTarget,giftId:Number(D.buyfor)})});S.gifts.balance=r.balance;toast('Подарок куплен и отправлен');paintProfile()}catch(x){toast(x.message);b.disabled=false}return}
  if(D.g){S.gt=D.g;return drawGifts()}
  if(D.spin){b.disabled=true;const bet=Number($('#slotbet')?.value);try{const r=await api('/api/fabrlmoney/spin',{method:'POST',body:JSON.stringify({bet})});S.gifts.balance=r.balance;drawGifts();$('#slotreels').innerHTML=r.symbols.map(x=>'<span>'+esc(x)+'</span>').join('');$('#slotresult').textContent=r.message}catch(x){toast(x.message)}finally{if($('#spin'))$('#spin').disabled=false}return}
  if(D.grantstars){b.disabled=true;try{const r=await api('/api/stars/grant',{method:'POST',body:JSON.stringify({target:$('#starstarget')?.value,amount:Number($('#starsamount')?.value)})});toast('Выдано '+fmt(r.amount)+' золотых яиц пользователю '+r.target);if(r.target.toLowerCase()===S.me.toLowerCase()){await loadGifts();drawGifts()}}catch(x){toast(x.message)}finally{b.disabled=false}return}
  if(b.id==='logout')return logout();
  if(!(D.buy||D.up||D.eq))return;
  b.disabled=true;const d=S.gifts;
  try{
    if(D.buy){
      const r=await api('/api/gifts/buy',{method:'POST',body:JSON.stringify({giftId:Number(D.buy)})});
      d.balance=r.balance;d.inventory.unshift(r.gift);toast('Куплено: '+d.catalog.find(x=>x.id===r.gift.gift_id).name)
    }else if(D.up){
      const r=await api('/api/gifts/upgrade',{method:'POST',body:JSON.stringify({inventoryId:Number(D.up)})});
      d.balance=r.balance;const i=d.inventory.findIndex(x=>String(x.id)===String(D.up));if(i>-1)d.inventory[i]=r.gift;
      toast('Уровень '+r.gift.level+' · '+r.gift.color+', '+r.gift.pattern)
    }else{
      const r=await api('/api/gifts/equip',{method:'POST',body:JSON.stringify({inventoryId:Number(D.eq)})});d.equipped=r.equipped
    }
  }catch(x){toast(x.message)}
  if(S.tab==='gifts')drawGifts()
}

/* ===== профиль ===== */
async function paintProfile(){
  const m=$('#main');
  if(!S.gifts){try{await loadGifts()}catch{}}
  if(S.tab!=='profile')return;
  const target=S.profileTarget;
  if(target&&target!==S.me){
    let p;try{p=await api('/api/profile/'+encodeURIComponent(target))}catch(e){m.innerHTML='<div class="em">'+esc(e.message)+'</div>';return}
    if(S.tab!=='profile'||S.profileTarget!==target)return;
    const mine=S.gifts?.inventory||[],cat=p.catalog||[],eq=p.equipped||[];
    const sh=(p.inventory||[]).filter(i=>eq.includes(Number(i.id))).map(i=>{const g=cat.find(x=>x.id===i.gift_id);return '<span class="gi sm" title="'+esc(g?.name||'Подарок')+'">'+gsv(g?.id||1,PAL[i.color]||PAL['Золото'])+'</span>'}).join('');
    const own=mine.map(i=>{const g=S.gifts.catalog.find(x=>x.id===i.gift_id);return '<div class="gc"><span class="gi">'+gsv(g?.id||1,PAL[i.color]||PAL['Золото'])+'</span><b>'+esc(g?.name||'Подарок')+'</b><small>Ур. '+i.level+'</small><button class="bt bl" data-sendgift="'+i.id+'">Подарить свой</button></div>'}).join('');
    const shop=cat.map(g=>'<div class="gc"><span class="gi">'+gsv(g.id,shopPal(g.price))+'</span><b>'+esc(g.name)+'</b><span class="pr">'+ic('egg')+fmt(g.price)+'</span><button class="bt go" data-buyfor="'+g.id+'" '+(Number(S.gifts.balance)<g.price?'disabled':'')+'>Купить ему/ей</button></div>').join('');
    m.innerHTML='<header class="ch"><button class="ib2 back" id="prback">'+ic('back')+'</button><div class="t"><b>Профиль пользователя</b><small>'+esc(target)+'</small></div></header><div class="pg" style="text-align:center">'+(p.avatar?'<img class="av big" style="object-fit:cover" src="'+p.avatar+'" alt="">':av(target,'big'))+'<h2 style="margin:12px 0 0">'+esc(target)+vf(target)+'</h2><p class="mut" style="margin-top:6px">Подарки на витрине</p><div>'+ (sh||'<span class="mut">Пока нет подарков на витрине</span>')+'</div><div class="wal">'+ic('egg')+'<div>'+fmt(S.gifts.balance)+' твоих золотых яиц<small>Выбери подарок ниже</small></div></div><h3 style="text-align:left;margin:18px 0 10px">Подарить из инвентаря</h3><div class="gg">'+(own||'<p class="mut">В инвентаре пока нет подарков</p>')+'</div><h3 style="text-align:left;margin:22px 0 10px">Купить подарок для '+esc(target)+'</h3><div class="gg">'+shop+'</div></div>';
    $('#prback').onclick=()=>{S.profileTarget=null;S.tab='chats';S.cur=target;setShell();paintSide();paintChat()};
    return;
  }
  const d=S.gifts,eq=d?.equipped||[];
  const sh=(d?.inventory||[]).filter(i=>eq.includes(Number(i.id))).map(i=>{const g=d.catalog.find(x=>x.id===i.gift_id);return'<span class="gi sm" style="--tc:#e8bb4d" title="'+esc(i.color+' · '+i.pattern+' · ур. '+i.level)+'">'+gsv(g?.id||1,PAL[i.color]||PAL['Золото'])+'</span>'}).join('');
  const admin=S.me.toLowerCase()==='alex';
  m.innerHTML='<header class="ch"><div class="t"><b>Профиль</b></div></header><div class="pg" style="text-align:center">'+av(S.me,'big')+'<h2 style="margin:12px 0 0">'+esc(S.me)+vf(S.me)+'</h2><div class="wal" style="margin-top:16px">'+ic('egg')+'<div>'+fmt(d?.balance??S.prof?.balance??0)+' золотых яиц</div></div><label class="bt bl" style="cursor:pointer">'+ic('image')+'Изменить аватар<input id="af2" type="file" accept="image/*" hidden></label><p class="mut" style="margin:18px 0 6px">Подарки на витрине</p><div>'+(sh||'<span class="mut">Пусто. Выбери подарки в разделе «Подарки».</span>')+'</div>'+(admin?'<div style="text-align:left;margin-top:24px;padding:14px;border:1px solid var(--line);border-radius:16px"><h3>Управление ФабрLink · Alex</h3><p class="mut" style="margin:6px 0 12px">Загрузка аватара Боба Пал Лаича и общего фона чатов для всех.</p><label class="bt" style="cursor:pointer;margin-bottom:8px">Аватар Боба<input id="botaf" type="file" accept="image/*" hidden></label><label class="bt" style="cursor:pointer">Общий фон чатов<input id="bgf" type="file" accept="image/*" hidden></label></div>':'')+'<button class="bt" id="logout" style="margin-top:24px">'+ic('logout')+'Выйти</button></div>';
  $('#af2').onchange=uploadAva;
  if(admin){$('#botaf').onchange=e=>uploadGlobalImage(e,'bot_avatar');$('#bgf').onchange=e=>uploadGlobalImage(e,'chat_background')}
}
async function uploadGlobalImage(e,key){
  const f=e.target.files?.[0];if(!f)return;
  try{const p=await prep(f);await api('/api/settings',{method:'PUT',body:JSON.stringify({key,value:p.data})});S.settings[key]=p.data;applyGlobalSettings();toast(key==='bot_avatar'?'Аватар Боба обновлён для всех':'Общий фон чатов обновлён для всех');paintProfile()}
  catch(x){toast(x.message)}
}
async function uploadAva(e){
  const f=e.target.files?.[0];if(!f)return;
  try{
    const im=await new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error('Не удалось открыть изображение'));i.src=u});
    const s=256,c=document.createElement('canvas'),k=Math.min(im.width,im.height);
    c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,s,s);
    const data=c.toDataURL('image/jpeg',.85);
    await api('/api/profile',{method:'PUT',body:JSON.stringify({avatar:data})});
    setAv(S.me,data);if(S.gifts)S.gifts.avatar=data;toast('Аватар обновлён');paintProfile();paintSide()
  }catch(x){toast(x.message)}
}

/* ===== живое обновление открытого чата ===== */
let busy=false;
setInterval(async()=>{
  if(busy||document.hidden||!S.token||S.tab!=='chats'||!S.cur)return;
  const n=S.cur;busy=true;
  try{
    const d=await api('/api/messages?peer='+encodeURIComponent(n));if(S.cur!==n)return;
    const old=(S.cache[n]||[]).filter(m=>!m.p),nw=d.messages||[];
    if(old.length===nw.length&&String(old.at(-1)?.id)===String(nw.at(-1)?.id))return;
    S.cache[n]=nw.concat((S.cache[n]||[]).filter(m=>m.p));drawMsgs(false);paintSide();paintInfo()
  }catch{}finally{busy=false}
},4000);
setInterval(async()=>{if(document.hidden||!S.token||!$('#sh'))return;try{await loadUsers();paintSide()}catch{}},60000);
setInterval(async()=>{if(document.hidden||!S.token||!$('#sh'))return;try{const old=S.settings.chat_background;await loadSettings();if(old!==S.settings.chat_background){applyGlobalSettings();if(S.tab==='chats')paintChat()}}catch{}},20000);

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
S.token&&S.me?boot():auth();
</script></body></html>
