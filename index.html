<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ФабрLink">
<title>ФабрLink — сайт</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="2341F654-35F3-4085-8DDD-522F7929D582.png" type="image/png">
<link rel="apple-touch-icon" href="2341F654-35F3-4085-8DDD-522F7929D582.png">
<style>
:root{color-scheme:dark;--bg:#070d24;--panel:rgba(18,28,64,.72);--line:rgba(130,160,255,.16);--text:#eaf0ff;--muted:#8b99c7;--blue:#1f8bff;--purple:#5b6cff;--me:#1b5fd6}
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 600px at 15% 10%,#16307a 0%,transparent 60%),radial-gradient(800px 600px at 90% 95%,#2a1b78 0%,transparent 60%),var(--bg)}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}input{width:100%;padding:12px 14px;background:#ffffff0c;border:1px solid var(--line);border-radius:12px;outline:0}input:focus{border-color:var(--blue)}button:focus-visible{outline:2px solid var(--blue)}#app{height:100%;padding:12px}.shell{height:100%;max-width:1400px;margin:auto;display:grid;grid-template-columns:72px 290px minmax(0,1fr) 240px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#080e28aa;backdrop-filter:blur(18px)}.rail,.list,.chat,.info{min-height:0}.rail{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px;border-right:1px solid var(--line)}.logo,.brandicon{display:block;object-fit:contain;background:#fff;border:1px solid #7b5137;overflow:hidden}.logo{width:58px;height:44px;border-radius:7px;margin-bottom:16px}.brandicon{width:72px;height:48px;border-radius:7px;flex:none}.rail button{width:58px;padding:10px 2px;border-radius:12px;color:var(--muted);background:transparent;font-size:11px}.rail button.active,.rail button:hover{background:var(--blue);color:white}.rail button span{display:block;margin-top:3px}.list{display:flex;flex-direction:column;border-right:1px solid var(--line)}.listhead{padding:20px 16px 10px}.listhead h1{font-size:21px;margin:0}.listhead p{color:var(--muted);font-size:12px;margin:5px 0 0}.search{padding:8px 12px}.items{overflow:auto;padding:4px 8px}.item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;text-align:left;background:transparent;border-radius:13px}.item:hover,.item.active{background:#ffffff0d}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:800}.meta{min-width:0;flex:1}.meta b,.meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{color:var(--muted);margin-top:3px}.chat{display:flex;flex-direction:column}.chathead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.chathead b,.chathead small{display:block}.chathead small{color:var(--muted)}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:18px}.empty{margin:auto;max-width:280px;text-align:center;color:var(--muted);padding:20px}.bubble{max-width:78%;align-self:flex-start;padding:10px 13px;border:1px solid var(--line);border-radius:16px;background:#ffffff0c;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:var(--me);border-color:transparent}.bubble time{display:block;text-align:right;color:#c8d7ff;font-size:10px;margin-top:4px}.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}.send,.primary{background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:12px;padding:12px 18px;font-weight:700}.giftgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px;overflow:auto}.giftcard{min-width:0;border:1px solid var(--line);background:linear-gradient(150deg,#ffffff0b,#ffffff03);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}.gifticon{font-size:34px;filter:drop-shadow(0 4px 10px #ffc83d44)}.giftprice{color:#ffd66b;font-weight:800}.giftcard button{width:100%;padding:9px 8px;border-radius:10px;background:#ffffff12;border:1px solid var(--line);font-size:12px}.giftcard button.primary{background:linear-gradient(135deg,#b87916,#f6d56d);color:#392100}.wallet{margin:10px 14px;padding:14px;border:1px solid #d7a73566;border-radius:15px;background:linear-gradient(135deg,#4c350d88,#a8791740);color:#ffdf80;font-weight:800}.profile .avatar{width:90px;height:90px;font-size:25px}.info{padding:20px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}.info h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:13px}.auth{height:100%;display:grid;place-items:center;padding:16px}.authcard{width:min(100%,380px);padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--panel);display:grid;gap:13px}.brand{display:flex;align-items:center;gap:11px;font-size:25px;font-weight:900}.brandicon{width:42px;height:42px;border-radius:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#ffffff0c;border-radius:12px}.tabs button{padding:9px;background:transparent;color:var(--muted);border-radius:9px}.tabs button.active{background:var(--blue);color:white}.error{color:#ff8296;min-height:18px;font-size:13px}.hint{font-size:12px;color:var(--muted)}.profile{padding:18px;display:grid;gap:12px}.profile button{padding:10px;border:1px solid var(--line);border-radius:12px;background:#ffffff0a}.verified{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin-left:5px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff1a8,#e8ae22 55%,#9c5b08);box-shadow:0 0 10px #ffc83d55;color:#6a3b00;font-size:12px;vertical-align:middle}.groupmark{font-size:15px;margin-left:5px;filter:drop-shadow(0 0 5px #ffc83d)}
@media(max-width:1050px){.shell{grid-template-columns:66px 260px minmax(0,1fr)}.info{display:none}}
@media(max-width:700px){#app{padding:0}.shell{border:0;border-radius:0;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.rail{grid-row:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:5px}.logo{display:none}.rail button{flex:1}.list{grid-row:1;border:0}.chat{grid-row:1;display:none}.shell.open .list{display:none}.shell.open .chat{display:flex}.shell.open .rail{display:none}.shell.open{grid-template-rows:minmax(0,1fr)}.bubble{max-width:88%}}
</style>
</head>
<body><main id="app"></main>
<script>const API='https://messap.onrender.com';
const $=s=>document.querySelector(s);
let token=localStorage.getItem('fl_token')||'',me=localStorage.getItem('fl_session')||null,current=null,view='chats',mode='login',query='',users=[],cache={},userAvatars={},profileData=null,giftData=null;
const GROUP="__rulers_world__",groupTitle="Правители мира",pair=(a,b)=>[a,b].sort().join("|"),time=t=>new Date(Number(t)).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
function verified(n){return String(n).toLowerCase()==="alex"?'<span class="verified" title="Подтверждённый пользователь" aria-label="Подтверждённый пользователь">🥚</span>':""}
function avatar(n){const src=userAvatars[n];return '<div class="avatar"'+(src?' style="background-image:url(\''+src+'\');background-size:cover;background-position:center;color:transparent"':'')+'>'+escapeHtml((n||'?').slice(0,2).toUpperCase())+'</div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(API+path,{...options,headers});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'Ошибка сервера ('+r.status+')');return data}
function showError(s){const e=$('#error');if(e)e.textContent=s}
async function loadUsers(){const d=await api('/api/users');users=d.users.map(u=>{if(u.avatar_data)userAvatars[u.username]=u.avatar_data;else delete userAvatars[u.username];return u.username})}
async function loadThread(n){if(cache[n])return cache[n];const d=await api('/api/messages?peer='+encodeURIComponent(n));cache[n]=d.messages||[];return cache[n]}
async function loadGifts(){giftData=await api('/api/gifts');if(giftData.avatar)userAvatars[me]=giftData.avatar;else delete userAvatars[me];return giftData}
async function giftAction(path,payload){try{await api(path,{method:'POST',body:JSON.stringify(payload)});await loadGifts();await fillChat();await fillInfo()}catch(e){alert(e.message)}}
function thread(n){return cache[n]||[]}
function auth(){current=null;$('#app').innerHTML='<section class="auth"><form class="authcard" id="auth"><div class="brand"><img class="brandicon" src="2341F654-35F3-4085-8DDD-522F7929D582.png" alt="ФабрLink">ФабрLink</div><div class="tabs"><button type="button" data-mode="login" class="'+(mode==='login'?'active':'')+'">Вход</button><button type="button" data-mode="reg" class="'+(mode==='reg'?'active':'')+'">Регистрация</button></div><input id="nick" autocomplete="username" placeholder="Ник (латиница, цифры, _)"><input id="pass" type="password" autocomplete="'+(mode==='login'?'current-password':'new-password')+'" placeholder="Пароль">'+(mode==='reg'?'<input id="pass2" type="password" autocomplete="new-password" placeholder="Повторите пароль">':'')+'<div id="error" class="error"></div><button class="primary">'+(mode==='login'?'Войти':'Создать аккаунт')+'</button><p class="hint">Аккаунты и сообщения хранятся на сервере ФабрLink.</p><p class="hint"><a href="logo-studio.html" style="color:#9fc7ff">Подготовить логотип и иконки →</a></p></form></section>';
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;auth()});
$('#auth').onsubmit=async e=>{e.preventDefault();const n=$('#nick').value.trim().toLowerCase(),p=$('#pass').value;if(!/^[a-z0-9_]{3,20}$/.test(n))return showError('Ник: 3–20 символов, латиница, цифры и _');if(p.length<6)return showError('Пароль должен быть не короче 6 символов');if(mode==='reg'&&p!==$('#pass2').value)return showError('Пароли не совпадают');const btn=$('#auth').querySelector('button.primary');btn.disabled=true;try{const d=await api(mode==='reg'?'/api/register':'/api/login',{method:'POST',body:JSON.stringify({username:n,password:p})});token=d.token;me=d.username;localStorage.setItem('fl_token',token);localStorage.setItem('fl_session',me);cache={};current=null;await loadUsers();render()}catch(err){showError(err.message)}finally{if(btn)btn.disabled=false}}}
async function render(){if(!token||!me){auth();return}try{const d=await api('/api/me');me=d.username;profileData=d;if(d.avatar_data)userAvatars[me]=d.avatar_data;else delete userAvatars[me];localStorage.setItem('fl_session',me);await loadUsers()}catch(e){token='';me=null;localStorage.removeItem('fl_token');localStorage.removeItem('fl_session');auth();showError(e.message);return}
$('#app').innerHTML='<div class="shell '+(current&&view==='chats'?'open':'')+'" id="shell"><nav class="rail"><img class="logo" src="2341F654-35F3-4085-8DDD-522F7929D582.png" alt="ФабрLink"><button data-view="chats" class="'+(view==='chats'?'active':'')+'">◫<span>Чаты</span></button><button data-view="saved" class="'+(view==='saved'?'active':'')+'">☆<span>Избранное</span></button><button data-view="gifts" class="'+(view==='gifts'?'active':'')+'">🥚<span>Подарки</span></button><button data-view="profile" class="'+(view==='profile'?'active':'')+'">◎<span>Профиль</span></button></nav><section class="list"><header class="listhead"><h1>'+(view==='profile'?'Профиль':view==='saved'?'Избранное':'Чаты')+'</h1><p>Общайтесь и сохраняйте заметки</p></header><div class="search"><input id="search" placeholder="Поиск по нику" value="'+escapeHtml(query)+'"></div><div class="items" id="items"></div></section><section class="chat" id="chat"></section><aside class="info" id="info"></aside></div>';
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;current=view==='saved'?me:null;render()});$('#search').oninput=e=>{query=e.target.value.toLowerCase();fillList()};await fillList();await fillChat();await fillInfo()}
async function fillList(){const box=$('#items');if(!box)return;if(view==='profile'){let gd;try{gd=await loadGifts()}catch{}box.innerHTML='<div class="profile">'+avatar(me)+'<b>'+escapeHtml(me)+verified(me)+'</b><span class="muted">Профиль ФабрLink</span><div class="wallet">🥚 '+Number(gd?.balance??profileData?.balance??10000).toLocaleString('en-US')+' золотых яиц</div><label class="primary" style="display:block;text-align:center;cursor:pointer">Изменить аватар<input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none"></label><div class="muted">Подарки на витрине</div><div>'+((gd?.inventory||[]).filter(g=>(gd.equipped||[]).includes(Number(g.id))).map(g=>{const c=gd.catalog.find(x=>x.id===g.gift_id);return '<span title="'+escapeHtml(g.color+' · '+g.pattern+' · уровень '+g.level)+'" style="display:inline-grid;place-items:center;width:43px;height:43px;margin:3px;border-radius:50%;border:2px solid #e8bb4d;background:radial-gradient(circle,#4d3a12,#10172d);font-size:21px">'+(c?.emoji||'🥚')+'</span>'}).join('')||'<span class="muted">Пока пусто — выбери подарки в магазине</span>')+'</div><button id="toGifts">Открыть магазин подарков</button><a href="logo-studio.html" style="color:#9fc7ff;padding:10px">Подготовить логотип и иконки →</a><button id="logout">Выйти</button></div>';$('#toGifts').onclick=()=>{view='gifts';render()};$('#avatarFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>1024*1024){alert('Выбери изображение до 1 МБ');return}const reader=new FileReader();reader.onload=async()=>{try{await api('/api/profile',{method:'PUT',body:JSON.stringify({avatar:reader.result})});userAvatars[me]=reader.result;await render()}catch(err){alert(err.message)}};reader.readAsDataURL(file)};$('#logout').onclick=()=>{token='';me=null;current=null;cache={};localStorage.removeItem('fl_token');localStorage.removeItem('fl_session');auth()};return}
const names=users.filter(n=>n!==me&&n.includes(query));await Promise.all([GROUP,me,...(current?[current]:[])].map(n=>loadThread(n).catch(()=>cache[n]=[])));names.sort((a,b)=>(thread(b).at(-1)?.t||0)-(thread(a).at(-1)?.t||0));const row=(n,label)=>{const g=n===GROUP;return '<button class="item '+(current===n?'active':'')+'" data-chat="'+escapeHtml(n)+'">'+avatar(g?'🌐':n)+'<span class="meta"><b>'+(g?escapeHtml(groupTitle)+' <span class="groupmark" title="Общая группа">🥚</span>':escapeHtml(label)+verified(n))+'</b><small>'+escapeHtml(thread(n).at(-1)?.x||(g?users.length+' участников · Общая группа':'Нет сообщений'))+'</small></span></button>'};box.innerHTML=row(GROUP,groupTitle)+row(me,'Избранное')+names.map(n=>row(n,n)).join('')+(names.length?'':'<p class="hint" style="padding:12px">Пока нет других зарегистрированных пользователей.</p>');box.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{current=b.dataset.chat;view='chats';render()})}
async function fillChat(){const c=$('#chat');if(!c)return;if(view==='gifts'){let d;try{d=await loadGifts()}catch(e){c.innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>';return}const inv=d.inventory||[],catalog=d.catalog||[];c.innerHTML='<header class="chathead"><button id="backGifts" style="background:#ffffff12;border-radius:10px;padding:8px 11px">←</button>'+avatar(me)+'<div><b>Золотые подарки</b><small>Покупай, улучшай и выставляй в профиле</small></div></header><div class="wallet">🥚 Баланс: '+Number(d.balance).toLocaleString('en-US')+' золотых яиц <span style="display:block;font-size:12px;font-weight:500;color:#ffe8a6">Улучшение стоит 750 × текущий уровень</span></div><div style="padding:0 14px;font-weight:800">Коллекция ('+inv.length+')</div><div class="giftgrid">'+(inv.length?inv.map(g=>{const item=catalog.find(x=>x.id===g.gift_id)||{name:'Подарок',emoji:'🥚'};const equipped=(d.equipped||[]).includes(Number(g.id));return '<div class="giftcard"><div class="gifticon">'+item.emoji+'</div><b>'+escapeHtml(item.name)+'</b><small>Уровень '+g.level+'</small><small>'+escapeHtml(g.color)+' · '+escapeHtml(g.pattern)+'</small><button data-upgrade="'+g.id+'">✨ Улучшить · '+(750*Number(g.level)).toLocaleString('en-US')+'</button><button data-equip="'+g.id+'">'+(equipped?'Убрать с профиля':'На аватарку')+'</button></div>'}).join(''):'<p class="muted">Пока нет подарков. Выбери первый ниже.</p>')+'</div><div style="padding:14px;font-weight:800">Магазин · 30 подарков</div><div class="giftgrid">'+catalog.map(g=>'<div class="giftcard"><div class="gifticon">'+g.emoji+'</div><b>'+escapeHtml(g.name)+'</b><span class="giftprice">🥚 '+Number(g.price).toLocaleString('en-US')+'</span><button class="primary" data-buy="'+g.id+'">Купить</button></div>').join('')+'</div>';$('#backGifts').onclick=()=>{view='chats';current=null;render()};c.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>giftAction('/api/gifts/buy',{giftId:Number(b.dataset.buy)}));c.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>giftAction('/api/gifts/upgrade',{inventoryId:Number(b.dataset.upgrade)}));c.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>giftAction('/api/gifts/equip',{inventoryId:Number(b.dataset.equip)}));return}if(!current){c.innerHTML='<div class="empty">Выберите чат слева</div>';return}const isGroup=current===GROUP,label=isGroup?groupTitle:(current===me?'Избранное':current);let items=[];try{items=await loadThread(current)}catch(e){c.innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>';return}c.innerHTML='<header class="chathead"><button id="backChat" aria-label="Назад к чатам" style="background:#ffffff12;border-radius:10px;padding:8px 11px">←</button>'+avatar(isGroup?'🌐':label)+'<div><b>'+escapeHtml(label)+(isGroup?' <span class="groupmark" title="Общая группа">🥚</span>':verified(label))+'</b><small>'+(isGroup?users.length+' участников · Общая группа':current===me?'Личные заметки':'@'+escapeHtml(label))+'</small></div></header><div class="msgs" id="msgs"></div><form class="composer" id="composer"><input id="message" placeholder="Написать сообщение…" autocomplete="off"><button class="send">➤</button></form>';$('#backChat').onclick=()=>{current=null;render()};const box=$('#msgs');box.innerHTML=items.length?items.map(m=>'<div class="bubble '+(m.f===me?'mine':'')+'">'+escapeHtml(m.x)+'<time>'+time(m.t)+'</time></div>').join(''):'<div class="empty">'+(current===me?'Сохраняйте здесь заметки — они доступны только вам.':'Начните переписку первым сообщением.')+'</div>';box.scrollTop=box.scrollHeight;$('#composer').onsubmit=async e=>{e.preventDefault();const input=$('#message'),body=input.value.trim();if(!body)return;const btn=$('#composer').querySelector('button');btn.disabled=true;try{await api('/api/messages',{method:'POST',body:JSON.stringify({peer:current,body})});delete cache[current];await render()}catch(err){alert(err.message)}finally{if(btn)btn.disabled=false}}}
async function fillInfo(){const i=$('#info');if(!i)return;if(view==='gifts'){i.innerHTML='<div class="empty">30 уникальных подарков<br><br>✨ Улучшай уровень<br>🎨 Получай случайный цвет и узор<br>🥚 Выставляй до 3 подарков в профиле</div>';return}if(!current){i.innerHTML='<div class="empty">Информация о чате появится здесь</div>';return}const g=current===GROUP,label=g?groupTitle:current===me?'Избранное':current;let items=[];try{items=await loadThread(current)}catch{}i.innerHTML=avatar(g?'🌐':label)+'<h2>'+escapeHtml(label)+(g?' <span class="groupmark">🥚</span>':verified(label))+'</h2><p class="muted">'+(g?'Общая группа для всех зарегистрированных пользователей':current===me?'Ваши личные заметки':'Пользователь ФабрLink')+'</p>'+(g?'<p class="muted">Участников: '+users.length+'</p><div class="muted" style="overflow-wrap:anywhere">'+users.map(n=>'@'+escapeHtml(n)+verified(n)).join(' · ')+'</div>':'')+'<p class="muted">Сообщений: '+items.length+'</p>'}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
(async()=>{if(token&&me){await render()}else auth()})();</script></body></html>
