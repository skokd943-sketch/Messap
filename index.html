<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ФабрLink">
<title>ФабрLink — сайт</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="2341F654-35F3-4085-8DDD-522F7929D582.png" type="image/png">
<link rel="apple-touch-icon" href="2341F654-35F3-4085-8DDD-522F7929D582.png">
<style>
:root{color-scheme:dark;--bg:#070d24;--panel:rgba(18,28,64,.72);--line:rgba(130,160,255,.16);--text:#eaf0ff;--muted:#8b99c7;--blue:#1f8bff;--purple:#5b6cff;--me:#1b5fd6}
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 600px at 15% 10%,#16307a 0%,transparent 60%),radial-gradient(800px 600px at 90% 95%,#2a1b78 0%,transparent 60%),var(--bg)}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}input{width:100%;padding:12px 14px;background:#ffffff0c;border:1px solid var(--line);border-radius:12px;outline:0}input:focus{border-color:var(--blue)}button:focus-visible{outline:2px solid var(--blue)}#app{height:100%;padding:12px}.shell{height:100%;max-width:1400px;margin:auto;display:grid;grid-template-columns:72px 290px minmax(0,1fr) 240px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#080e28aa;backdrop-filter:blur(18px)}.rail,.list,.chat,.info{min-height:0}.rail{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px;border-right:1px solid var(--line)}.logo,.brandicon{display:block;object-fit:contain;background:#fff;border:1px solid #7b5137;overflow:hidden}.logo{width:58px;height:44px;border-radius:7px;margin-bottom:16px}.brandicon{width:72px;height:48px;border-radius:7px;flex:none}.rail button{width:58px;padding:10px 2px;border-radius:12px;color:var(--muted);background:transparent;font-size:11px}.rail button.active,.rail button:hover{background:var(--blue);color:white}.rail button span{display:block;margin-top:3px}.list{display:flex;flex-direction:column;border-right:1px solid var(--line)}.listhead{padding:20px 16px 10px}.listhead h1{font-size:21px;margin:0}.listhead p{color:var(--muted);font-size:12px;margin:5px 0 0}.search{padding:8px 12px}.items{overflow:auto;padding:4px 8px}.item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;text-align:left;background:transparent;border-radius:13px}.item:hover,.item.active{background:#ffffff0d}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:800}.meta{min-width:0;flex:1}.meta b,.meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{color:var(--muted);margin-top:3px}.chat{display:flex;flex-direction:column}.chathead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.chathead b,.chathead small{display:block}.chathead small{color:var(--muted)}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:18px}.empty{margin:auto;max-width:280px;text-align:center;color:var(--muted);padding:20px}.bubble{max-width:78%;align-self:flex-start;padding:10px 13px;border:1px solid var(--line);border-radius:16px;background:#ffffff0c;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:var(--me);border-color:transparent}.bubble time{display:block;text-align:right;color:#c8d7ff;font-size:10px;margin-top:4px}.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}.send,.primary{background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:12px;padding:12px 18px;font-weight:700}.info{padding:20px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}.info h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:13px}.auth{height:100%;display:grid;place-items:center;padding:16px}.authcard{width:min(100%,380px);padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--panel);display:grid;gap:13px}.brand{display:flex;align-items:center;gap:11px;font-size:25px;font-weight:900}.brandicon{width:42px;height:42px;border-radius:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#ffffff0c;border-radius:12px}.tabs button{padding:9px;background:transparent;color:var(--muted);border-radius:9px}.tabs button.active{background:var(--blue);color:white}.error{color:#ff8296;min-height:18px;font-size:13px}.hint{font-size:12px;color:var(--muted)}.profile{padding:18px;display:grid;gap:12px}.profile button{padding:10px;border:1px solid var(--line);border-radius:12px;background:#ffffff0a}.verified{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin-left:5px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff1a8,#e8ae22 55%,#9c5b08);box-shadow:0 0 10px #ffc83d55;color:#6a3b00;font-size:12px;vertical-align:middle}.groupmark{font-size:15px;margin-left:5px;filter:drop-shadow(0 0 5px #ffc83d)}
@media(max-width:1050px){.shell{grid-template-columns:66px 260px minmax(0,1fr)}.info{display:none}}
@media(max-width:700px){#app{padding:0}.shell{border:0;border-radius:0;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.rail{grid-row:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:5px}.logo{display:none}.rail button{flex:1}.list{grid-row:1;border:0}.chat{grid-row:1;display:none}.shell.open .list{display:none}.shell.open .chat{display:flex}.shell.open .rail{display:none}.shell.open{grid-template-rows:minmax(0,1fr)}.bubble{max-width:88%}}
</style>
</head>
<body><main id="app"></main>
<script>
const $=s=>document.querySelector(s), read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let users=read('fl_users',{}),messages=read('fl_msgs',{}),me=read('fl_session',null),current=null,view='chats',mode='login',query='';
const GROUP="__rulers_world__", groupTitle="Правители мира", pair=(a,b)=>[a,b].sort().join("|"), thread=n=>n===GROUP?(messages["group|rulers"]||[]):messages[me===n?"saved|"+me:pair(me,n)]||[], time=t=>new Date(t).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
function verified(n){return String(n).toLowerCase()==="alex"?'<span class="verified" title="Подтверждённый пользователь" aria-label="Подтверждённый пользователь">🥚</span>':""}
function avatar(n){return '<div class="avatar">'+escapeHtml((n||'?').slice(0,2).toUpperCase())+'</div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function hash(p,s){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:120000,hash:'SHA-256'},key,256);return btoa(String.fromCharCode(...new Uint8Array(bits)))}
function auth(){ $('#app').innerHTML='<section class="auth"><form class="authcard" id="auth"><div class="brand"><img class="brandicon" src="2341F654-35F3-4085-8DDD-522F7929D582.png" alt="ФабрLink">ФабрLink</div><div class="tabs"><button type="button" data-mode="login" class="'+(mode==='login'?'active':'')+'">Вход</button><button type="button" data-mode="reg" class="'+(mode==='reg'?'active':'')+'">Регистрация</button></div><input id="nick" autocomplete="username" placeholder="Ник (латиница, цифры, _)"><input id="pass" type="password" autocomplete="current-password" placeholder="Пароль">'+(mode==='reg'?'<input id="pass2" type="password" placeholder="Повторите пароль">':'')+'<div id="error" class="error"></div><button class="primary">'+(mode==='login'?'Войти':'Создать аккаунт')+'</button><p class="hint">Демо-версия: аккаунты и сообщения хранятся только в этом браузере.</p><p class="hint"><a href="logo-studio.html" style="color:#9fc7ff">Подготовить логотип и иконки →</a></p></form></section>';
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;auth()});$('#auth').onsubmit=async e=>{e.preventDefault();const n=$('#nick').value.trim().toLowerCase(),p=$('#pass').value,err=$('#error');if(!/^[a-z0-9_]{3,20}$/.test(n))return err.textContent='Ник: 3–20 символов, латиница, цифры и _';if(p.length<6)return err.textContent='Пароль должен быть не короче 6 символов';if(mode==='reg'){if(p!==$('#pass2').value)return err.textContent='Пароли не совпадают';if(users[n])return err.textContent='Такой ник уже занят';const salt=crypto.randomUUID();users[n]={salt,hash:await hash(p,salt),created:Date.now()};write('fl_users',users)}else if(!users[n]||users[n].hash!==await hash(p,users[n].salt))return err.textContent='Неверный ник или пароль';me=n;write('fl_session',me);render()}}
function render(){if(!me||!users[me])return auth();$('#app').innerHTML='<div class="shell '+(current&&view==='chats'?'open':'')+'" id="shell"><nav class="rail"><img class="logo" src="2341F654-35F3-4085-8DDD-522F7929D582.png" alt="ФабрLink"><button data-view="chats" class="'+(view==='chats'?'active':'')+'">◫<span>Чаты</span></button><button data-view="saved" class="'+(view==='saved'?'active':'')+'">☆<span>Избранное</span></button><button data-view="profile" class="'+(view==='profile'?'active':'')+'">◎<span>Профиль</span></button></nav><section class="list"><header class="listhead"><h1>'+(view==='profile'?'Профиль':view==='saved'?'Избранное':'Чаты')+'</h1><p>Общайтесь и сохраняйте заметки</p></header><div class="search"><input id="search" placeholder="Поиск по нику" value="'+escapeHtml(query)+'"></div><div class="items" id="items"></div></section><section class="chat" id="chat"></section><aside class="info" id="info"></aside></div>';
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;current=view==='saved'?me:null;render()});$('#search').oninput=e=>{query=e.target.value.toLowerCase();fillList()};fillList();fillChat();fillInfo()}
function fillList(){const box=$('#items');if(view==='profile'){box.innerHTML='<div class="profile">'+avatar(me)+'<b>'+escapeHtml(me)+'</b><span class="muted">Профиль ФабрLink</span><a href="logo-studio.html" style="color:#9fc7ff;padding:10px">Подготовить логотип и иконки →</a><button id="logout">Выйти</button></div>';$('#logout').onclick=()=>{me=null;current=null;localStorage.removeItem('fl_session');auth()};return}const names=Object.keys(users).filter(n=>n!==me&&n.includes(query));names.sort((a,b)=>(thread(b).at(-1)?.t||0)-(thread(a).at(-1)?.t||0));const row=(n,label)=>{const g=n===GROUP;return '<button class="item '+(current===n?'active':'')+'" data-chat="'+escapeHtml(n)+'">'+avatar(g?'🌐':n)+'<span class="meta"><b>'+(g?escapeHtml(groupTitle)+' <span class="groupmark" title="Верифицированная группа">🥚</span>':escapeHtml(label)+verified(n))+'</b><small>'+escapeHtml(thread(n).at(-1)?.x||(g?Object.keys(users).length+' участников · Общая группа':'Нет сообщений'))+'</small></span></button>'};box.innerHTML=row(GROUP,groupTitle)+row(me,'Избранное')+names.map(n=>row(n,n)).join('')+(names.length?'':'<p class="hint" style="padding:12px">Пока нет других аккаунтов в этом браузере.</p>');box.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{current=b.dataset.chat;view='chats';render()})}
function fillChat(){const c=$('#chat');if(!current){c.innerHTML='<div class="empty">Выберите чат слева</div>';return}const isGroup=current===GROUP,label=isGroup?groupTitle:(current===me?"Избранное":current);c.innerHTML='<header class="chathead">'+avatar(isGroup?'🌐':label)+'<div><b>'+escapeHtml(label)+(isGroup?' <span class="groupmark" title="Верифицированная группа">🥚</span>':verified(label))+'</b><small>'+(isGroup?Object.keys(users).length+' участников · Все зарегистрированные в этом браузере':current===me?'Личные заметки':'@'+escapeHtml(label))+'</small></div></header><div class="msgs" id="msgs"></div><form class="composer" id="composer"><input id="message" placeholder="Написать сообщение…" autocomplete="off"><button class="send">➤</button></form>';const box=$('#msgs'),items=thread(current);box.innerHTML=items.length?items.map(m=>'<div class="bubble '+(m.f===me?'mine':'')+'">'+escapeHtml(m.x)+'<time>'+time(m.t)+'</time></div>').join(''):'<div class="empty">'+(current===me?'Сохраняйте здесь заметки — они доступны только вам.':'Начните переписку первым сообщением.')+'</div>';box.scrollTop=box.scrollHeight;$('#composer').onsubmit=e=>{e.preventDefault();const x=$('#message').value.trim();if(!x)return;const k=current===GROUP?"group|rulers":current===me?"saved|"+me:pair(me,current);(messages[k]=messages[k]||[]).push({f:me,x,t:Date.now()});write('fl_msgs',messages);render()}}
function fillInfo(){const i=$('#info');if(!current){i.innerHTML='<div class="empty">Информация о чате появится здесь</div>';return}const g=current===GROUP,label=g?groupTitle:current===me?'Избранное':current;i.innerHTML=avatar(g?'🌐':label)+'<h2>'+escapeHtml(label)+(g?' <span class="groupmark">🥚</span>':verified(label))+'</h2><p class="muted">'+(g?'Общая группа для всех зарегистрированных пользователей':current===me?'Ваши личные заметки':'Пользователь ФабрLink')+'</p>'+(g?'<p class="muted">Участников: '+Object.keys(users).length+'</p><div class="muted" style="overflow-wrap:anywhere">'+Object.keys(users).map(n=>'@'+escapeHtml(n)+verified(n)).join(' · ')+'</div>':'')+'<p class="muted">Сообщений: '+thread(current).length+'</p><button id="clear" class="primary">Очистить переписку</button>';$('#clear').onclick=()=>{if(confirm('Очистить переписку?')){delete messages[current===GROUP?"group|rulers":current===me?"saved|"+me:pair(me,current)];write('fl_msgs',messages);render()}}}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
