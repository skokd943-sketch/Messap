<style>
:root{color-scheme:dark;--bg:#060b1f;--tx:#eaf0ff;--mut:#8b9bc4;--line:#8aa4ff1f;--blue:#2f8cff;--gold:#ffd66b;--pn:linear-gradient(165deg,#121c4acc,#0a1130ee);--in:#ffffff0f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-user-select:none;user-select:none;background:radial-gradient(900px 620px at 8% 0,#1c3fae 0,transparent 60%),radial-gradient(800px 620px at 100% 100%,#40209f 0,transparent 55%),var(--bg)}
html{position:fixed;inset:0;width:100%}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea{font-size:16px;cursor:text;-webkit-user-select:text;user-select:text;outline:0}
button:focus-visible{outline:2px solid var(--blue)}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;width:100%;height:var(--vh,100dvh);min-height:0;padding:14px;overflow:hidden}
.shell{height:100%;max-width:1380px;margin:auto;position:relative;display:grid;grid-template-columns:78px 330px minmax(0,1fr);border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#070d2680}
.nav{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-right:1px solid var(--line);background:#0a113066}
.lg{width:44px;height:44px;display:grid;place-items:center;color:#cfe0ff;margin-bottom:8px}

.nav button.on{color:#fff;background:linear-gradient(135deg,#2f8cff,#4a5dff);box-shadow:0 6px 18px #2f6bff55}
.nav .sp{flex:1}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--pn)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 16px 10px}
.sh h1{font-size:22px;font-weight:700}
.sh h1 span{color:var(--blue)}
.sh button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--tx);background:var(--in)}
.sr{position:relative;margin:0 14px 8px}

.sr input{width:100%;padding:11px 14px 11px 38px;border-radius:14px;background:var(--in);border:1px solid var(--line)}
.sr input:focus{border-color:var(--blue)}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 8px 8px}
.lbl{display:flex;align-items:center;gap:6px;padding:10px 10px 4px;color:var(--mut);font-size:12px}
.lbl .ic{width:14px;height:14px}
.it{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:14px;text-align:left}
.it:active{background:var(--in)}
.it.on{background:linear-gradient(90deg,#2f6bff55,#2f6bff18)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background-size:cover;background-position:center}
.av .ic{width:24px;height:24px}

.av.big .ic{width:44px;height:44px}
.mt{min-width:0;flex:1}
.mt b,.mt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt small{color:var(--mut);margin-top:2px}
.tm{font-size:11px;color:var(--mut);align-self:flex-start;margin-top:4px}
.vf{display:inline-block;vertical-align:-2px;margin-left:5px}
.vf .ic{width:15px;height:15px}
.main{display:flex;flex-direction:column;min-height:0;min-width:0;background:linear-gradient(180deg,#0b1338aa,#070c2488)}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#0a113088}
.ch .av{width:42px;height:42px;font-size:14px}
.ch .t{flex:1;min-width:0}
.ch b{display:block}
.ch small{color:var(--mut)}
.ib2{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--tx)}
.ib2:active{background:var(--in)}
.back{display:none}
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 8px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;margin:10px 0;padding:3px 14px;border-radius:99px;background:#ffffff12;color:var(--mut);font-size:12px}
.bub{max-width:min(78%,520px);padding:8px 12px 6px;border-radius:16px 16px 16px 5px;background:#26387a88;border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#2a74f5,#1d52d0);border-color:transparent;border-radius:16px 16px 5px 16px}
.bub.pend{opacity:.65}
.bub .nm{display:block;font-size:12px;font-weight:700}
.bub time{float:right;margin:7px 0 0 10px;font-size:11px;color:#ffffff90;display:inline-flex;align-items:center;gap:3px}
.bub time .ic{width:12px;height:12px}
.bub.im{padding:4px;white-space:normal}
.bub.im time{position:absolute;right:10px;bottom:9px;margin:0;padding:1px 7px;border-radius:99px;background:#0008;float:none}
.bub.im{position:relative}
.bub.im .nm{padding:3px 8px}
.ph{display:block;width:min(280px,66vw);aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#ffffff10;cursor:zoom-in}
.ph.bad{cursor:default;outline:1px dashed var(--line)}
.cm{display:flex;gap:8px;align-items:flex-end;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0a113088}
.cm textarea{flex:1;resize:none;max-height:120px;padding:11px 16px;border-radius:22px;background:var(--in);border:1px solid var(--line);line-height:1.35}
.cm .ib2{width:44px;height:44px;border-radius:50%;background:var(--in);color:var(--mut)}
.cm .snd{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2f8cff,#4a5dff);display:grid;place-items:center;flex:none;color:#fff}
.em{margin:auto;padding:24px;text-align:center;color:var(--mut)}
.info{display:none;position:absolute;top:0;right:0;bottom:0;width:min(320px,100%);z-index:5;flex-direction:column;background:linear-gradient(165deg,#111b45f2,#0a1130fa);border-left:1px solid var(--line)}
.shell.info-on.in-chat .info{display:flex}
.ih{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.ibody{flex:1;overflow-y:auto;padding:0 16px 20px;text-align:center}
.ibody h3{margin-top:12px;font-size:18px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.st div{padding:12px;border-radius:14px;background:var(--in);border:1px solid var(--line)}
.st b{display:block;font-size:22px}
.st span{color:var(--mut);font-size:12px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#ffffff10;cursor:zoom-in}
.pg{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 24px}
.wal{display:flex;align-items:center;gap:12px;margin:14px 0;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#5a4210cc,#a87a1acc);color:#ffe9a8;font-weight:800;font-size:18px;text-align:left}
.wal .ic{width:30px;height:30px}
.wal small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:14px;background:var(--in);margin-bottom:12px}
.seg button{padding:9px;border-radius:11px;color:var(--mut)}
.seg button.on{background:linear-gradient(135deg,#2f8cff,#4a5dff);color:#fff}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gc{border-radius:18px;padding:14px 10px 12px;background:var(--pn);border:1px solid var(--tc,var(--line));display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.gc b{font-size:14px}
.gc small{color:var(--mut)}
.gi{width:78px;height:78px;padding:12px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffffff22,#0a1130 72%);border:1px solid var(--tc,var(--line))}
.gi.sm{display:inline-block;width:50px;height:50px;padding:8px;margin:3px}
.gsv{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 6px #0007)}
.gsv .a{fill:var(--a)}.gsv .b{fill:var(--b)}.gsv .d{fill:var(--b);opacity:.8}.gsv .k{fill:#0c1230}.gsv .w{fill:#fff;fill-opacity:.55}
.gsv .s{fill:none;stroke:var(--a);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pr{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-weight:800}
.pr .ic{width:16px;height:16px}
.lv{font-size:11px;padding:1px 9px;border-radius:99px;background:#ffffff18}
.bt{width:100%;padding:10px;border-radius:12px;background:var(--in);border:1px solid var(--line);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.bt .ic{width:16px;height:16px}
.bt.go{background:linear-gradient(135deg,#c28a1c,#f6d56d);border-color:transparent;color:#2e1c00;font-weight:700}
.bt.bl{background:linear-gradient(135deg,#2f8cff,#4a5dff);border-color:transparent;color:#fff;font-weight:700}
.bt:disabled{opacity:.45}
.mut{color:var(--mut);font-size:13px}
.au{height:100%;display:grid;place-items:center;padding:16px}
.ac{width:min(100%,380px);padding:26px;border-radius:24px;background:var(--pn);border:1px solid var(--line);display:grid;gap:12px}
.ac input{width:100%;padding:13px 14px;border-radius:14px;background:var(--in);border:1px solid var(--line)}
.ac .seg{margin:0}
.br{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800}
.br img{width:46px;height:46px;border-radius:13px;object-fit:cover}
.er{color:#ff8296;min-height:18px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:10px 16px;border-radius:14px;background:#000d;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;z-index:40;background:#000d;display:grid;place-items:center;padding:16px;touch-action:none}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
#lb button{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;color:#fff}
@media(min-width:1200px){.shell.info-on.in-chat{grid-template-columns:78px 330px minmax(0,1fr) 300px}.shell.info-on.in-chat .info{position:static;width:auto}}
@media(max-width:760px){
#app{padding:0}
.shell{height:100%;min-height:0;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;max-width:none;border:0;border-radius:0}
.nav{grid-row:2;grid-column:1;min-height:76px;flex-direction:row;justify-content:space-around;gap:0;padding:4px 6px max(8px,env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:#0a1130f2}
.nav button{flex:1;min-width:0;padding:7px 1px;font-size:10px;white-space:nowrap}.nav button .ic{width:20px;height:20px}
.nav button.on{box-shadow:none}
.lg,.nav .sp,.nav .lo{display:none}
.side,.main{grid-row:1;grid-column:1}
.shell:not(.t-chats) .side,.shell.in-chat .side{display:none}
.shell.t-chats:not(.in-chat) .main{display:none}
.shell.in-chat{grid-template-rows:minmax(0,1fr)}
.shell.in-chat .nav{display:none}
.back{display:grid}
.side{border-right:0}
.info{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<style>.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d875;margin-left:6px}.online-dot.off{background:#778092}.msg-tools{display:none;gap:5px;margin-top:7px;flex-wrap:wrap}.bub.msg-menu-open .msg-tools{display:flex}.msg-tools button{font-size:12px;padding:6px 9px;border-radius:8px;background:#0002;color:inherit;touch-action:manipulation}.bub{user-select:none;-webkit-user-select:none}.reply-preview{font-size:12px;padding:4px 7px;border-left:3px solid #ffd66b;background:#0002;margin-bottom:5px}

/* Аварийный экран: не оставляем приложение полностью пустым при ошибке JS. */
window.addEventListener('error',e=>{
  if(!document.querySelector('#app'))return;
  if(document.querySelector('#app').children.length===0){
    document.querySelector('#app').innerHTML='<section style="max-width:560px;margin:10vh auto;padding:24px;border:1px solid #ff6677;border-radius:18px;background:#10162b;color:#fff;font:15px/1.5 system-ui"><h2 style="margin:0 0 10px">ФабрLink не смог запуститься</h2><p style="margin:0 0 10px">Произошла ошибка интерфейса. Обновите страницу. Если ошибка повторится, этот текст поможет её найти:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:#ffb8c0">'+String(e.message||'Неизвестная ошибка').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:10px;background:#3478f6;color:white;font-weight:700">Перезагрузить</button></section>';
  }
});
window.addEventListener('unhandledrejection',e=>console.error('FabrlLink async error:',e.reason));

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ru');
const hm=t=>new Date(Number(t)).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
const dk=t=>{const d=new Date(Number(t));return d.toDateString()===new Date().toDateString()?'Сегодня':d.toLocaleDateString('ru',{day:'numeric',month:'long'})};
const ic=(n,c='')=>'<svg class="ic '+c+'"><use href="#i-'+n+'"/></svg>';
const vf=n=>String(n).toLowerCase()==='alex'?'<span class="vf" title="Подтверждённый пользователь">'+ic('egg')+'</span>':'';
const IMG=/^\[img:(\d+)(?::(\d+)x(\d+))?\]$/;
const VOICE=/^\[voice:(\d+):(\d+)\]$/;const vdur=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const GIFTRE=/^\[gift:(\d+):(\d+):(\d+):(\d+):(\d+)\]$/;
const last=n=>(S.cache[n]||[]).at(-1);
const disp=n=>n==='pal_laich'?'Боб Пал Лаич':n;

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(tt);tt=setTimeout(()=>t.className='',2400)}

/* высота под клавиатуру и запрет масштабирования */
const setVh=()=>{const h=window.visualViewport?.height||window.innerHeight;document.documentElement.style.setProperty('--vh',h+'px')};
setVh();window.visualViewport?.addEventListener('resize',setVh);addEventListener('resize',setVh);
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));

document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault();if(e.key==='Escape')closeLb()});

async function api(p,o={}){
  const h={'Content-Type':'application/json'};if(S.token)h.Authorization='Bearer '+S.token;
  const c=new AbortController(),to=setTimeout(()=>c.abort(),40000);
  try{
    const r=await fetch(API+p,{...o,headers:h,signal:c.signal});let d={};try{d=await r.json()}catch{}
    if(r.status===401&&S.token){logout(true);throw new Error(d.error||'Нужно войти снова')}
    if(!r.ok)throw new Error(d.error||'Ошибка сервера ('+r.status+')');return d
  }catch(e){throw e.name==='AbortError'?new Error('Сервер не отвечает, попробуйте ещё раз'):e instanceof TypeError?new Error('Нет соединения с сервером'):e}
  finally{clearTimeout(to)}
}

/* узор коллекционного подарка: зависит от названия узора и номера экземпляра, поэтому у каждого он свой */
function patSvg(pat,p,id){
  const r=n=>((Number(id||1)*9301+n*49297)%233280)/233280,a=p[0],f='fill="'+a+'" opacity=".38"',st='fill="none" stroke="'+a+'" stroke-width="1.6" opacity=".5"';

function blobUrl(d){try{const[h,b]=d.split(','),m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:m}))}catch{return''}}
function setAv(u,d){if(!d){delete S.av[u];delete S.raw[u];return}if(S.raw[u]===d)return;if(S.av[u])URL.revokeObjectURL(S.av[u]);S.raw[u]=d;S.av[u]=blobUrl(d)}

const pend={};
function getImg(id){if(S.imgs[id])return Promise.resolve(S.imgs[id]);return pend[id]||(pend[id]=fetch(API+'/api/images/'+id,{headers:{Authorization:'Bearer '+S.token}}).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>S.imgs[id]=URL.createObjectURL(b)).finally(()=>delete pend[id]))}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);getImg(e.target.dataset.img).then(u=>{e.target.src=u;e.target.classList.add('ok')}).catch(()=>e.target.classList.add('bad'))}}),{rootMargin:'300px'});
function lazyImgs(root){root.querySelectorAll('img[data-img]:not(.ok)').forEach(el=>{const u=S.imgs[el.dataset.img];if(u){el.src=u;el.classList.add('ok')}else io.observe(el)})}
function prep(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);let d=c.toDataURL('image/jpeg',.82);if(d.length>1400000)d=c.toDataURL('image/jpeg',.55);res({data:d,w,h})};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Не удалось открыть изображение'))};im.src=u})}
async function sendImage(file){
  if(!file||!S.cur||!file.type.startsWith('image/'))return;
  const peer=S.cur;let p;try{p=await prep(file)}catch(e){return toast(e.message)}
  const tmp={id:'t'+Date.now()+Math.random(),f:S.me,x:'[img:local]',t:Date.now(),p:1,local:p.data,w:p.w,h:p.h};
  (S.cache[peer]=S.cache[peer]||[]).push(tmp);if(S.cur===peer)drawMsgs(true);paintSide();
  try{
    const d=await api('/api/images',{method:'POST',body:JSON.stringify({peer,image:p.data,w:p.w,h:p.h})});
    const m=IMG.exec(d.message.x);if(m)S.imgs[m[1]]=blobUrl(p.data);
    const a=S.cache[peer],i=a.indexOf(tmp);if(i>-1){a.some(x=>String(x.id)===String(d.message.id))?a.splice(i,1):a[i]=d.message}
  }catch(e){const a=S.cache[peer],i=a.indexOf(tmp);if(i>-1)a.splice(i,1);toast(e.message)}
  if(S.cur===peer)drawMsgs(false);S.reply=null;$('#replybar')?.remove();paintSide();paintInfo()
}

  $('#af').onsubmit=async e=>{
    e.preventDefault();
    const n=$('#nick').value.trim().toLowerCase(),p=$('#pass').value,er=$('#er');
    if(!/^[a-z0-9_]{3,20}$/.test(n))return er.textContent='Ник: 3–20 символов, латиница, цифры и _';
    if(p.length<6)return er.textContent='Пароль не короче 6 символов';
    if(S.mode==='reg'&&p!==$('#pass2').value)return er.textContent='Пароли не совпадают';
    const b=$('#go'),t0=b.textContent;b.disabled=true;er.textContent='';
    const w=setTimeout(()=>b.textContent='Сервер просыпается…',3500);

  if(VA){VA.pause();const o=velm();if(o){o.classList.remove('pl');const i=o.parentElement.querySelector('.vw i');if(i)i.style.width='0'}}
  b.classList.add('ld');
  try{if(!vurl[id]){const r=await fetch(API+'/api/voice/'+id,{headers:{Authorization:'Bearer '+S.token}});if(!r.ok)throw 0;vurl[id]=URL.createObjectURL(await r.blob())}}
  catch{b.classList.remove('ld');return toast('Не удалось загрузить голосовое')}
  b.classList.remove('ld');
  const a=new Audio(vurl[id]);VA=a;VID=id;
  a.onplay=a.onpause=a.ontimeupdate=vsync;
  a.onended=()=>{const e=velm();if(e){e.classList.remove('pl');const i=e.parentElement.querySelector('.vw i');if(i)i.style.width='0'}VA=null;VID=null};
  a.play().catch(()=>toast('Не удалось воспроизвести'))
}
function bindRec(){
  $('#mic').onclick=startRec;$('#recx').onclick=()=>endRec(false);$('#recok').onclick=()=>endRec(true);
  if(REC)$('#cf').classList.add('recording')
}
async function startRec(){
  if(REC||!S.cur)return;
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Запись голоса не поддерживается в этом браузере');
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch{return toast('Разреши доступ к микрофону')}
  const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000}),chunks=[];
  REC={rec,st,chunks,t0:Date.now(),peer:S.cur,mt:rec.mimeType||mt||'audio/webm',tick:null};
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.start(300);$('#cf')?.classList.add('recording');updRec();REC.tick=setInterval(updRec,250)
}
function updRec(){if(!REC)return;const s=Math.floor((Date.now()-REC.t0)/1000),t=$('#rect');if(t)t.textContent=vdur(s);if(s>=60)endRec(true)}
function endRec(send){
  if(!REC)return;const R=REC;REC=null;clearInterval(R.tick);$('#cf')?.classList.remove('recording');
  const ms=Date.now()-R.t0,dur=Math.max(1,Math.round(ms/1000));
  R.rec.onstop=()=>{R.st.getTracks().forEach(t=>t.stop());if(!send)return;if(ms<800)return toast('Слишком короткое голосовое');sendVoice(R.peer,new Blob(R.chunks,{type:R.mt}),dur)};
  try{R.rec.stop()}catch{R.st.getTracks().forEach(t=>t.stop())}
}
async function sendVoice(peer,blob,dur){
  const tmp={id:'t'+Date.now(),f:S.me,x:'Отправка голосового…',t:Date.now(),p:1};
  (S.cache[peer]=S.cache[peer]||[]).push(tmp);if(S.cur===peer)drawMsgs(true);paintSide();
  try{
    const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)});
    const d=await api('/api/voice',{method:'POST',body:JSON.stringify({peer,audio:data,dur})});
    const a=S.cache[peer],i=a.indexOf(tmp);if(i>-1){a.some(x=>String(x.id)===String(d.message.id))?a.splice(i,1):a[i]=d.message}
  }catch(e){const a=S.cache[peer],i=a.indexOf(tmp);if(i>-1)a.splice(i,1);toast(e.message||'Не удалось отправить голосовое')}
  if(S.cur===peer)drawMsgs(false);paintSide()
}

/* ===== push-уведомления ===== */
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const pushOk=()=>'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window;
const u8=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushSub(ask){
  if(!pushOk()){if(ask)toast(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!standalone()?'Добавь сайт на экран «Домой» (Поделиться → На экран «Домой»), открой оттуда и нажми колокольчик':'Этот браузер не поддерживает уведомления');return false}
  if(Notification.permission==='denied'){if(ask)toast('Уведомления заблокированы в настройках браузера');return false}
  if(Notification.permission!=='granted'){if(!ask)return false;if(await Notification.requestPermission()!=='granted')return false}
  try{
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    const k=await api('/api/push/key'),want=u8(k.key);
    if(sub){const have=sub.options&&sub.options.applicationServerKey?new Uint8Array(sub.options.applicationServerKey):null;if(have&&(have.length!==want.length||have.some((v,i)=>v!==want[i]))){await sub.unsubscribe();sub=null}}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:want});
    await api('/api/push/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})});return true
  }catch(e){if(ask)toast('Не удалось включить уведомления: '+e.message);return false}
}
function pushOff(){
  const tk=S.token;if(!tk||!pushOk())return;
  navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).then(s=>{if(s)fetch(API+'/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify({endpoint:s.endpoint})}).catch(()=>{})}).catch(()=>{})
}
function bindBell(){
  const b=$('#bell');
  if(b){b.onclick=async()=>{if(await pushSub(true)){toast('Уведомления включены');b.hidden=true}};const ok=pushOk()&&Notification.permission==='granted';b.hidden=ok;if(ok)pushSub(false)}
  const c=new URLSearchParams(location.search).get('chat');
  if(c)setTimeout(()=>{history.replaceState(null,'',location.pathname);openChat(c)},0)
}
if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.openChat&&S.token)openChat(e.data.openChat)});

  +(adm?'<div class="admin-stars"><h3>Выдать золотые яйца · Alex</h3><p class="mut" style="margin:5px 0 10px">Выдай себе или выбранному пользователю из списка.</p><div class="fm-row"><select id="starstarget" style="min-width:160px;flex:1"><option value="'+esc(S.me)+'">'+esc(S.me)+' (мне)</option><option value="all">Всем пользователям</option></select><input id="starsamount" type="number" min="1" max="1000000" value="1000" style="max-width:115px"></div><button class="bt go" id="grantstars" data-grantstars="1">Выдать яйца</button></div>':'')+'</div>';
  drawHist();

async function doSpin(){
  if(SPIN)return;const btn=$('#spin'),inp=$('#slotbet');if(!btn||!inp)return;
  SPIN=true;btn.disabled=true;
  const reels=[...document.querySelectorAll('.reel')],ids=CAS.symbols.map(s=>s.id);
  reels.forEach(r=>r.classList.remove('win','stop'));reels.forEach(r=>r.classList.add('spin'));
  const tm=reels.map(r=>setInterval(()=>{r.innerHTML=slotSv(ids[Math.random()*ids.length|0])},80));
  let r;
  try{r=await api('/api/fabrlmoney/spin',{method:'POST',body:JSON.stringify({bet:Number(inp.value)})})}
  catch(x){tm.forEach(clearInterval);reels.forEach(e=>e.classList.remove('spin'));toast(x.message);SPIN=false;btn.disabled=false;return}
  S.gifts.balance=r.balance;
  for(let i=0;i<3;i++){await sleep(i?420:650);clearInterval(tm[i]);if(!reels[i].isConnected)break;reels[i].classList.remove('spin');reels[i].innerHTML=slotSv(r.symbols[i]);reels[i].classList.add('stop')}
  SPIN=false;if(!reels[0].isConnected)return;

}
